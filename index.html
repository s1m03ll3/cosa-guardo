<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>CosaGuardo</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#20242d; --line:#2a2f3a;
    --text:#eef0f4; --muted:#9aa1ad; --accent:#ff5a5f; --accent2:#ffb347; --ok:#3ecf8e; --gold:#f5c542;
    --r:16px;
    --field:#626a7a; /* bordo dei campi e dello switch spento: 3.2:1 su --card */
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding-bottom:84px}
  a{color:var(--accent2)}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
  header h1{font-size:22px;margin:0;letter-spacing:-.3px}
  header h1 span,.logo span{color:var(--accent)}
  .pill{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:99px;cursor:pointer}
  .pill.ok{color:var(--ok);border-color:var(--ok)}
  .pill.gold{color:var(--gold);border-color:var(--gold)}
  h2{font-size:15px;margin:22px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center}
  .section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:8px 12px;border-radius:99px;font-size:14px;cursor:pointer;user-select:none;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#1a0d0a}
  .chip.plat.on,.chip.src.on{background:#2d5cff;border-color:#2d5cff;color:#fff}
  .logo-img{width:22px;height:22px;border-radius:6px;pointer-events:none;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
  .row{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:12px 0}
  .row label{font-size:14px}
  select,input[type=text],input[type=email],input[type=number],input[type=password]{background:var(--card2);color:var(--text);border:1px solid var(--field);border-radius:10px;padding:10px 12px;font-size:15px;width:100%}
  .row select{width:auto}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .switch{position:relative;width:44px;height:26px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;background:var(--field);border-radius:99px;transition:.2s;cursor:pointer}
  .switch span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked+span{background:var(--ok)}
  .switch input:checked+span:before{transform:translateX(18px)}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;color:#1a0d0a;text-align:center;
       background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px rgba(255,90,95,.25)}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line);font-weight:600;font-size:14px;padding:12px;color:var(--text)}
  .btn.danger{background:transparent;box-shadow:none;border:1px solid #6b2a2c;color:#ff8a8d;font-size:14px;padding:12px}
  .btn.white{background:#fff;color:#111;box-shadow:none}
  .btn.dark{background:#000;color:#fff;box-shadow:none;border:1px solid #333}
  .btn.sm{width:auto;display:inline-block;padding:9px 14px;font-size:14px}
  .stack>*+*{margin-top:10px}
  .btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .muted{color:var(--muted);font-size:13px}
  .count{font-size:13px;color:var(--muted);text-align:center;margin:10px 0 0;min-height:18px}
  .banner{background:#3a2a10;border:1px solid #7a5a1a;color:#ffd58a;border-radius:12px;padding:12px;font-size:14px;margin-bottom:6px;cursor:pointer}
  .adbanner{margin-top:18px;border:1px dashed #555;border-radius:12px;padding:12px;text-align:center;font-size:12px;color:var(--muted)}
  .adbanner b{display:block;color:var(--text);font-size:14px;margin:2px 0}
  /* result */
  .result{margin-top:18px;border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--line);animation:pop .35s ease}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .hero{position:relative;min-height:210px;display:flex;align-items:flex-end;gap:14px;padding:16px;background-size:cover;background-position:center}
  .hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,17,21,.1),rgba(24,27,34,.95))}
  .hero>*{position:relative}
  .hero .poster{width:96px;height:144px;border-radius:10px;object-fit:cover;box-shadow:0 6px 20px rgba(0,0,0,.5);flex:none;background:var(--card2)}
  .hero .bigemoji{position:absolute;right:16px;top:10px;font-size:60px}
  .hero h3{margin:0 0 4px;font-size:22px;line-height:1.15;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .hero .tagline{font-size:13px;color:#d6d9e0;font-style:italic}
  .meta{padding:6px 16px 16px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
  .tag{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
  .origin{font-size:13px;background:#1d2a45;border:1px solid #2d4370;color:#bcd0ff;border-radius:10px;padding:7px 10px;margin:4px 0 10px}
  .provs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 12px}
  .prov{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:4px 8px 4px 4px}
  .prov.mine{border-color:var(--ok)}
  .plot{font-size:15px;line-height:1.45;margin:0}
  .empty{text-align:center;padding:26px 14px;color:var(--muted)}
  /* list items */
  .item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .thumb{width:44px;height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;overflow:hidden;position:relative}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .item .info{flex:1;min-width:0}
  .item .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item.seen .t{text-decoration:line-through;color:var(--muted)}
  .icon{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:16px;flex:none}
  .listcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;margin-bottom:10px}
  .listcard .lic{width:46px;height:46px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
  .listcard .info{flex:1;min-width:0}
  .listcard .t{font-weight:700;font-size:16px}
  .avs{display:flex}
  .av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;border:2px solid var(--card);margin-left:-6px;flex:none}
  .avs .av:first-child{margin-left:0}
  .av.lg{width:56px;height:56px;font-size:24px;border:0;margin:0}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:24px;letter-spacing:4px;font-weight:700;text-align:center;background:var(--card2);border-radius:12px;padding:12px;margin:8px 0}
  .back{background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:0;margin:4px 0 8px}
  /* nav */
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);
      display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
  nav .in{display:flex;max-width:560px;width:100%}
  nav button{flex:1;background:none;border:0;color:var(--muted);font-size:12px;padding:6px;cursor:pointer}
  nav button b{display:block;font-size:22px;margin-bottom:2px;height:24px}
  nav button svg{width:24px;height:24px;display:block;margin:0 auto}
  nav button.on{color:var(--text)}
  nav button b{position:relative}
  .badge{position:absolute;top:-4px;right:-10px;min-width:18px;height:18px;border-radius:99px;background:var(--accent);color:#1a0d0a;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}
  .view{display:none}.view.on{display:block}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:#111;padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
  /* sheet */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.on{display:flex}
  .sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet h3{margin:0 0 6px;font-size:19px}
  .opt{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;background:var(--card2)}
  .opt.on{border-color:var(--accent);background:#2a1a1c}
  .opt .lic{font-size:24px}
  /* onboarding */
  .onb{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;display:none}
  .onb.on{display:block}
  .onb .wrap{min-height:100%;display:flex;flex-direction:column;padding-top:28px;padding-bottom:30px}
  .onb .body{flex:1}
  .onb h2.big{font-size:26px;color:var(--text);text-transform:none;letter-spacing:-.3px;margin:8px 0 6px;display:block}
  .onbfoot{position:sticky;bottom:0;margin-top:24px;padding:14px 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%)}
  .dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .dots i.on{background:var(--accent);width:20px;border-radius:99px}
  .hero-emoji{font-size:84px;text-align:center;margin:40px 0 10px}
  .logo{font-size:34px;font-weight:800;text-align:center;letter-spacing:-.5px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tile{aspect-ratio:2/3;border-radius:10px;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:flex-end;padding:6px;font-size:12px;font-weight:600;border:2px solid transparent}
  .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tile span{position:relative;text-shadow:0 1px 6px #000}
  .tile.on{border-color:var(--ok)}
  .tile.on:after{content:"✓";position:absolute;top:6px;right:6px;background:var(--ok);color:#000;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
  /* loader + ad */
  .loader{position:fixed;inset:0;background:rgba(10,11,14,.97);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .loader.on{display:flex}
  .reel{font-size:72px;height:96px;animation:bounce .5s ease infinite alternate}
  @keyframes bounce{to{transform:translateY(-8px) rotate(-6deg)}}
  .loader .msg{font-size:17px;font-weight:600;margin:8px 0 20px;min-height:24px}
  .adbox{width:100%;max-width:400px;border-radius:16px;overflow:hidden;border:1px solid #333;background:#16181d}
  .adbox .adlbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#888;padding:8px 12px;display:flex;justify-content:space-between}
  .adbox .adcreative{height:210px;background:linear-gradient(135deg,#3b2b6b,#1b6b7b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff}
  .adbox .adcreative b{font-size:20px}
  .adbar{height:4px;background:#333}.adbar i{display:block;height:100%;background:var(--accent2);width:0;transition:width linear}
  .premium-cta{margin-top:14px;font-size:13px;color:var(--gold);cursor:pointer;background:none;border:0}
  .feat{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px}
  .price{display:flex;justify-content:space-between;align-items:center}
  .attrib{font-size:12px;color:var(--muted);line-height:1.5;margin-top:16px}
  .profhead{display:flex;gap:14px;align-items:center}
  .gcard{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;cursor:pointer}
  .gcard .gic{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
  .gcard .t{font-weight:700;font-size:17px}
  .game{position:fixed;inset:0;background:var(--bg);z-index:25;display:none;flex-direction:column;user-select:none}
  .game.on{display:flex}
  .ghead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;max-width:560px;width:100%;margin:0 auto}
  .ghead b{font-size:17px}
  .gq{text-align:center;color:var(--muted);font-size:14px;margin:0 16px 8px}
  .gstack{position:relative;flex:1;max-width:400px;width:calc(100% - 40px);margin:6px auto 10px;min-height:280px}
  .scard{position:absolute;inset:0;border-radius:22px;overflow:hidden;background-size:cover;background-position:center;box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:none;cursor:grab;will-change:transform}
  .scard.back{transform:scale(.95) translateY(10px);filter:brightness(.6)}
  .scard .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px}
  .scard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .scard .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 18px 18px;background:linear-gradient(transparent,rgba(0,0,0,.92))}
  .scard .cap h3{margin:0;font-size:24px;line-height:1.15}
  .scard .cap .muted{color:#cfd3db}
  .stamp{position:absolute;top:26px;padding:6px 12px;border:4px solid;border-radius:10px;font-weight:900;font-size:22px;letter-spacing:1px;opacity:0;text-transform:uppercase;background:rgba(0,0,0,.35)}
  .stamp.r{left:20px;color:var(--ok);border-color:var(--ok);transform:rotate(-14deg)}
  .stamp.l{right:20px;color:#c9ced8;border-color:#c9ced8;transform:rotate(14deg)}
  .stamp.d{left:50%;top:auto;bottom:150px;transform:translateX(-50%);color:#ff6b6e;border-color:#ff6b6e;white-space:nowrap}
  .gbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:400px;width:calc(100% - 40px);margin:0 auto}
  .gbtns button{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:16px;padding:10px 4px;cursor:pointer;font-size:24px}
  .gbtns button small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .gbtns .gr{border-color:#2f6b52}.gbtns .gd{border-color:#6b2a2c}
  .gfoot{display:flex;justify-content:space-between;align-items:center;max-width:400px;width:calc(100% - 40px);margin:10px auto calc(14px + env(safe-area-inset-bottom));font-size:13px;color:var(--muted)}
  .tut{position:absolute;inset:0;background:rgba(10,11,14,.94);z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .tut h3{font-size:22px;margin:0 0 6px}
  .tut .demo{width:150px;height:210px;border-radius:16px;background:linear-gradient(135deg,#3b2b6b,#1b6b7b);margin:18px auto;display:flex;align-items:center;justify-content:center;font-size:54px;animation:tutsw 4.5s ease-in-out infinite}
  @keyframes tutsw{0%,10%{transform:none}20%,28%{transform:translateX(70px) rotate(10deg)}38%,46%{transform:none}56%,64%{transform:translateX(-70px) rotate(-10deg)}74%,82%{transform:translateY(60px)}92%,100%{transform:none}}
  .tut .rowt{display:flex;gap:12px;align-items:center;text-align:left;margin:6px 0;font-size:15px;max-width:330px;width:100%}
  .tut .rowt b{font-size:24px;width:34px;text-align:center;flex:none}
  .srcrow{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
  .srcrow .muted{flex:none}
  .hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .hscroll::-webkit-scrollbar{display:none}
  .hscroll .chip{flex:none;padding:7px 11px;font-size:13px}
  .flabel{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.5px}
  #modeFilters .flabel:first-child{margin-top:0}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .grid3 select{width:100%;padding:9px 8px;font-size:14px}
  .link{color:#bcd0ff;font-size:13px;cursor:pointer}
  details.more{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
  details.more summary{cursor:pointer;color:var(--muted);font-size:14px}
  details.more .row:last-child{margin-bottom:0}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;position:sticky;bottom:76px;z-index:4;padding:8px 0;background:linear-gradient(transparent,var(--bg) 30%)}
  .actions .btn{padding:14px 8px}
  .reshead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px}
  .reshead b{font-size:16px}
  .ressub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 2px}
  .ritem{cursor:pointer}
  .ritem .origin-mini{font-size:12px;color:#bcd0ff}
  .avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .avopt{border:2px solid transparent;border-radius:14px;background:var(--card2);padding:10px 4px;text-align:center;cursor:pointer;font-size:11px;color:var(--muted)}
  .avopt span{display:flex;width:52px;height:52px;margin:0 auto 6px;border-radius:50%;align-items:center;justify-content:center;font-size:30px}
  .avopt.on{border-color:var(--accent);color:var(--text)}
  .av.emo{font-size:16px}
  .av.lg.emo{font-size:34px}
  .seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:9px;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--text);color:#111;font-weight:600}
  .ask{display:flex;gap:8px}
  .ask input{flex:1;min-width:0}
  .ask .btn{width:auto;padding:10px 16px;font-size:15px;flex:none}
  .understood{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px}
  .understood .tag{color:var(--text)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .hint i{cursor:pointer;color:#bcd0ff;font-style:normal}
  .fu{background:linear-gradient(135deg,#1d2a45,#2a1d3f);border:1px solid #3b4a7a;border-radius:var(--r);padding:14px;margin-bottom:6px;display:flex;gap:12px;align-items:center}
  .fu .info{flex:1;min-width:0}
  .fu .btns{grid-template-columns:1fr 1fr 1fr;margin-top:10px}
  .fu .btn.ghost{padding:9px 4px;font-size:13px}
  .watch{margin-top:12px}
  .chip .x{opacity:.7;margin-left:2px}
  nav button{font-size:11px;padding:6px 2px}
  .chips.sm{gap:6px}
  .chips.sm .chip{padding:6px 10px;font-size:13px}
  .clearx{flex:none;width:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-size:16px;cursor:pointer}
  .actions2{display:grid;gap:10px;margin-top:14px}
  .actions2 .btn small{display:block;font-size:12px;font-weight:500;opacity:.92;margin-top:3px}
  .btn.big{padding:16px;font-size:19px}

const fold = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

function mockApi(path, q){
  const strip = m => { const {providers,runtime,...r}=m; return r; };
  const ids=s=>String(s).split(/[|,]/).map(Number);
  if(path==="/search/keyword") return {results:DEMO_KEYWORDS.filter(k=>k.name.includes(fold(q.query))).map(({films,...k})=>k)};
  if(path==="/search/person") return {results:DEMO_PEOPLE.filter(p=>fold(q.query).split(/\s+/).every(w=>fold(p.name).includes(w))).map(({films,...p})=>p)};
  if(path==="/genre/movie/list") return {genres:BASE_GENRES};
  if(path==="/watch/providers/movie") return {results:DEMO_PROVIDERS.map(([id,name],i)=>({provider_id:id,provider_name:name,logo_path:null,display_priorities:{IT:i}}))};
  if(path==="/discover/movie"||path==="/search/movie"){
    let r=DEMO;
    if(path==="/search/movie") r=r.filter(m=>fold(m.title).includes(fold(q.query)));
    else{
      const films=(list,s)=>ids(s).flatMap(id=>(list.find(x=>x.id===id)||{films:[]}).films);
      if(q.with_keywords){ const f=films(DEMO_KEYWORDS,q.with_keywords); r=r.filter(m=>f.includes(m.id)); }
      if(q.with_cast){ const f=films(DEMO_PEOPLE,q.with_cast); r=r.filter(m=>f.includes(m.id)); }
      if(q.with_crew){ const f=films(DEMO_PEOPLE,q.with_crew); r=r.filter(m=>f.includes(m.id)); }
      if(q.with_watch_providers) r=r.filter(m=>m.providers.some(p=>ids(q.with_watch_providers).includes(p)));
      if(q.with_genres) r=r.filter(m=>m.genre_ids.some(g=>ids(q.with_genres).includes(g)));
      if(q.without_genres) r=r.filter(m=>!m.genre_ids.some(g=>ids(q.without_genres).includes(g)));
      if(q["with_runtime.lte"]) r=r.filter(m=>m.runtime<=q["with_runtime.lte"]);
      if(q["vote_average.gte"]) r=r.filter(m=>m.vote_average>=q["vote_average.gte"]);
      if(q["primary_release_date.gte"]) r=r.filter(m=>m.release_date>=q["primary_release_date.gte"]);
      if(q["primary_release_date.lte"]) r=r.filter(m=>m.release_date<=q["primary_release_date.lte"]);
    }
    const page=+q.page||1, per=20;
    return {page,results:r.slice((page-1)*per,page*per).map(strip),total_results:r.length,total_pages:Math.max(1,Math.ceil(r.length/per))};
  }
  const mm=path.match(/^\/movie\/(\d+)$/);
  if(mm){
    const m=DEMO.find(x=>x.id===+mm[1]); if(!m) throw new Error("HTTP 404");
    const flat=m.providers.map(id=>{const p=DEMO_PROVIDERS.find(x=>x[0]===id); return {provider_id:id,provider_name:p[1],logo_path:null};});
    return {...strip(m),runtime:m.runtime,genres:m.genre_ids.map(id=>({id})),tagline:"",
      "watch/providers":{results:{IT:{link:null,flatrate:flat}}}};
  }
  throw new Error("HTTP 404");
}

const DB_KEY = "cosaguardo_db_v3", DEV_KEY = "cosaguardo_dev";
const DB = {
  data:null,
  empty(){ return {users:[],profiles:{},lists:[],list_members:[],list_items:[],list_invites:[],seen:[],ratings:[],dismissed:[],swipes:[],quiz:[],session:null}; },
  load(){ try{ this.data=JSON.parse(localStorage.getItem(DB_KEY)); }catch(e){} if(!this.data) this.data=this.empty();
    for(const [k,v] of Object.entries(this.empty())) if(!(k in this.data)) this.data[k]=v;
    for(const u of this.data.users) if(!u.username && u.provider!=="guest") u.username=Usernames.suggest(u.name);
    this.migrate(); },
  // aggiorna i dati salvati dalle versioni precedenti del prototipo
  migrate(){ const d=this.data;
    for(const l of d.lists) if(l.type==="couple"||l.type==="friends") l.type="custom";   // niente più liste coppia/amici
    for(const m of d.list_members) if(m.role==="member") m.role="viewer";                 // i membri diventano "collegati"
    delete d.list_links;
    for(const u of d.users){                                                              // ognuno ha "La mia lista" e "Rewatch"
      if(!d.lists.some(l=>l.owner_id===u.id&&l.type==="personal")) createListFor(u.id,"La mia lista","personal");
      if(!d.lists.some(l=>l.owner_id===u.id&&l.type==="rewatch")) createListFor(u.id,"Rewatch","rewatch");
    } },
  save(){ localStorage.setItem(DB_KEY, JSON.stringify(this.data)); },
};
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => p+"_"+Math.random().toString(36).slice(2,10);
function createListFor(userId,name,type){
  const l={id:uid("l"),name,type,owner_id:userId,invite_code:null,created_at:Date.now()};
  DB.data.lists.push(l); DB.data.list_members.push({list_id:l.id,user_id:userId,role:"owner",joined_at:Date.now()}); return l;
}
// @nomeutente: unico, 3-20 caratteri, minuscole/numeri/punto/trattino basso. In produzione l'unicità la garantisce il DB
const Usernames = {
  norm: s => fold(s).replace(/^@/,"").replace(/[^a-z0-9._]/g,""),
  valid: u => /^[a-z0-9._]{3,20}$/.test(u) && !/^[._]|[._]$/.test(u),
  taken: (u,exceptId) => DB.data.users.some(x=>x.username===u && x.id!==exceptId),
  suggest(name){ let base=Usernames.norm(String(name).trim().replace(/\s+/g,".")).replace(/^[._]+|[._]+$/g,"").slice(0,16);
    if(base.length<3) base=(base+"film").slice(0,16); let u=base,i=1; while(Usernames.taken(u)) u=base+(++i); return u; },
  error(u,exceptId){ if(!Usernames.valid(u)) return "Da 3 a 20 caratteri: lettere minuscole, numeri, punto o trattino basso";
    if(Usernames.taken(u,exceptId)) return "Nome utente già in uso"; return null; },
};
const D = () => DB.data;

const Auth = {
  current(){ const s=D().session; return s ? D().users.find(u=>u.id===s.userId)||null : null; },
  signUp({name,email,provider,username}){
    const u={id:uid("u"),name,username:username||null,email:email||null,provider,created_at:Date.now()};
    D().users.push(u);
    D().profiles[u.id]={providerIds:[],favGenres:[],onboarded:false,premium:false,filters:clone(DEFAULT_FILTERS)};
    D().session={userId:u.id};
    createListFor(u.id,"La mia lista","personal"); createListFor(u.id,"Rewatch","rewatch");
    DB.save(); return u;
  },
  login(userId){ D().session={userId}; DB.save(); },
  logout(){ D().session=null; DB.save(); },
  byEmail(email){ return D().users.find(u=>u.email && u.email.toLowerCase()===email.toLowerCase()); },
  upgradeGuest(name,email,username){ const u=Auth.current(); Object.assign(u,{name,email,username,provider:"email"}); DB.save(); },
  setUsername(username){ Auth.current().username=username; DB.save(); },
  deleteAccount(){
    const id=Auth.current().id, d=D();
    for(const l of d.lists.filter(l=>l.owner_id===id)) Lists.remove(l.id);   // le liste collegate spariscono anche agli altri
    d.list_members=d.list_members.filter(m=>m.user_id!==id);
    d.list_invites=d.list_invites.filter(x=>x.from_user!==id && x.to_user!==id);
    for(const k of ["seen","ratings","dismissed","swipes","quiz"]) d[k]=d[k].filter(x=>x.user_id!==id);
    delete d.profiles[id];
    d.users=d.users.filter(u=>u.id!==id);
    d.session=null; DB.save();
  },
};
const userById = id => D().users.find(u=>u.id===id);
const userName = id => userById(id)?.name || "Utente eliminato";

/* Liste:
   - "La mia lista" (personal) e "Rewatch" (rewatch) ci sono sempre; Rewatch = i film già visti
   - liste a tema create dall'utente (custom), es. "Film romantici"
   - collegamento: chi accetta l'invito vede la lista nel suo profilo come "Lista @nome" (sola lettura, sempre aggiornata) */
const Lists = {
  mine(){ const me=Auth.current(); if(!me) return [];
    const ids=D().list_members.filter(m=>m.user_id===me.id).map(m=>m.list_id), rank={personal:0,rewatch:1,custom:2};
    return D().lists.filter(l=>ids.includes(l.id)).sort((a,b)=>((a.owner_id===me.id?rank[a.type]:3)-(b.owner_id===me.id?rank[b.type]:3))||a.created_at-b.created_at); },
  owned(){ const me=Auth.current()?.id; return Lists.mine().filter(l=>l.owner_id===me); },
  shared(){ const me=Auth.current()?.id; return Lists.mine().filter(l=>l.owner_id!==me); },
  get(id){ return D().lists.find(l=>l.id===id); },
  isMember(id){ return Lists.mine().some(l=>l.id===id); },
  members(id){ return D().list_members.filter(m=>m.list_id===id).map(m=>({...m,user:userById(m.user_id)})); },
  viewers(id){ return Lists.members(id).filter(m=>m.role==="viewer"); },
  newCode(){ const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s; do{ s=[...Array(6)].map(()=>c[Math.random()*c.length|0]).join(""); }while(D().lists.some(l=>l.invite_code===s)); return s; },
  ensureCode(id){ const l=Lists.get(id); if(!l.invite_code){ l.invite_code=Lists.newCode(); DB.save(); } return l.invite_code; },
  create(name,type="custom"){ const l=createListFor(Auth.current().id,name,type); DB.save(); return l; },
  rename(id,name){ Lists.get(id).name=name; DB.save(); },
  byCode(code){ return code ? D().lists.find(x=>x.invite_code===String(code).trim().toUpperCase()) : null; },
  addViewer(id,userId){
    const l=Lists.get(id); if(!l) return {error:"La lista non esiste più"};
    if(l.owner_id===userId) return {error:"È una tua lista",list:l};
    if(D().list_members.some(m=>m.list_id===id&&m.user_id===userId)) return {error:"Hai già questa lista",list:l};
    D().list_members.push({list_id:id,user_id:userId,role:"viewer",joined_at:Date.now()});
    D().list_invites.forEach(i=>{ if(i.list_id===id&&i.to_user===userId&&i.status==="pending") i.status="accepted"; });
    DB.save(); return {list:l};
  },
  joinByLink(code){ const l=Lists.byCode(code); return l ? Lists.addViewer(l.id,Auth.current().id) : {error:"Invito non valido o scaduto"}; },
  unshare(id,userId){ D().list_members=D().list_members.filter(m=>!(m.list_id===id&&m.user_id===userId&&m.role==="viewer")); DB.save(); },
  leave(id){ Lists.unshare(id,Auth.current().id); },
  remove(id){ const d=D(); d.lists=d.lists.filter(l=>l.id!==id); d.list_members=d.list_members.filter(m=>m.list_id!==id);
    d.list_items=d.list_items.filter(i=>i.list_id!==id); d.list_invites=d.list_invites.filter(x=>x.list_id!==id); DB.save(); },
  items(id){ const l=Lists.get(id); if(!l) return [];
    if(l.type==="rewatch") return D().seen.filter(s=>s.user_id===l.owner_id&&s.movie&&!s.noRewatch).sort((a,b)=>b.at-a.at)
      .map(s=>({id:"s_"+s.movie_id,list_id:id,movie:s.movie,added_by:l.owner_id,added_at:s.at}));
    return D().list_items.filter(i=>i.list_id===id); },
  allItems(id){ return Lists.items(id); },
  has(id,movieId){ return Lists.items(id).some(i=>i.movie.id===movieId); },
  add(id,movie){ const l=Lists.get(id);
    if(l.type==="rewatch") return Seen.set(movie.id,true,movie);
    if(Lists.has(id,movie.id)) return;
    D().list_items.unshift({id:uid("i"),list_id:id,movie:liteMovie(movie),added_by:Auth.current().id,added_at:Date.now()}); DB.save(); },
  removeItem(id,movieId){ const l=Lists.get(id);
    if(l?.type==="rewatch"){ const s=D().seen.find(x=>x.user_id===l.owner_id&&x.movie_id===movieId); if(s) s.noRewatch=true; DB.save(); return; }
    D().list_items=D().list_items.filter(i=>!(i.list_id===id&&i.movie.id===movieId)); DB.save(); },
  personal(){ return Lists.owned().find(l=>l.type==="personal") || Lists.create("La mia lista","personal"); },
  rewatch(){ return Lists.owned().find(l=>l.type==="rewatch") || Lists.create("Rewatch","rewatch"); },
};
// inviti di collegamento: la lista compare a chi accetta
const Invites = {
  forList(id){ return D().list_invites.filter(i=>i.list_id===id&&i.status==="pending"); },
  received(){ const me=Auth.current(); return me ? D().list_invites.filter(i=>i.to_user===me.id&&i.status==="pending"&&Lists.get(i.list_id)) : []; },
  send(listId,userId){
    if(Lists.members(listId).some(m=>m.user_id===userId)) return {error:"Ha già questa lista"};
    if(Invites.forList(listId).some(i=>i.to_user===userId)) return {error:"Invito già inviato"};
    D().list_invites.push({id:uid("inv"),list_id:listId,from_user:Auth.current().id,to_user:userId,status:"pending",at:Date.now()}); DB.save(); return {};
  },
  get(id){ return D().list_invites.find(i=>i.id===id); },
  cancel(id){ D().list_invites=D().list_invites.filter(i=>i.id!==id); DB.save(); },
  accept(id){ const i=Invites.get(id); const r=Lists.addViewer(i.list_id,i.to_user); if(!r.error) i.status="accepted"; DB.save(); return r; },
  decline(id){ Invites.get(id).status="declined"; DB.save(); },
};
// ricerca utenti registrati: SOLO per @nomeutente (per privacy non si cerca per nome o email)
const Users = {
  search(q){ const me=Auth.current().id, f=Usernames.norm(q.trim()); if(f.length<2) return [];
    return D().users.filter(u=>u.id!==me && u.username && u.username.startsWith(f))

let GENRES = BASE_GENRES, PROVIDERS = [], metaOk = false, showAllProv = false;
const devKey = () => (localStorage.getItem(DEV_KEY)||"").trim();
const isDemo = () => !devKey();
const memo = new Map();
async function api(path, params={}, forceMock=false){
  const q={}; for(const [k,v] of Object.entries(params)) if(v!==undefined&&v!==null&&v!=="") q[k]=v;
  if(isDemo()||forceMock){ await sleep(120); return mockApi(path,q); }
  const key=devKey(), isToken=key.startsWith("eyJ");
  const u=new URL(API+path);
  for(const [k,v] of Object.entries(q)) u.searchParams.set(k,v);
  if(!isToken) u.searchParams.set("api_key",key);
  const url=u.toString();
  if(memo.has(url)) return memo.get(url);
  const p=fetch(url,{headers:{accept:"application/json",...(isToken?{Authorization:"Bearer "+key}:{})}})
    .then(async r=>{ if(r.status===401) throw new Error("KEY"); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
  memo.set(url,p); p.catch(()=>memo.delete(url));
  return p;
}

  else if((m=low.match(/(\d+(?:[.,]5)?|un|una|due|tre|quattro)\s*'?\s*or[ae](\s*e\s*mezz[ao])?/))) dur=(NL_NUM[m[1]]||parseFloat(m[1].replace(",",".")))*60+(m[2]?30:0);
  else if((m=low.match(/(\d{2,3})\s*(?:minuti|min)\b/))) dur=+m[1];
  else if(rx("cort\\w*|breve|veloce").test(low)) dur=100;
  if(dur>=30 && dur<=300) out.maxDur=dur;
  // 4) epoca: "anni 80", "anni '90", "anni ottanta", "del 1994", "recente", "classico"
  if((m=low.match(/anni\s*'?\s*(\d0)\b/)) || (m=low.match(/anni\s+(sessanta|settanta|ottanta|novanta|duemila)/))){
    const d=NL_DECADES[m[1]]??+m[1], from=d>=50?1900+d:2000+d; out.years=[from,from+9]; out.yearsLabel=`Anni ${String(d).padStart(2,"0")}`;
  } else if((m=low.match(/\b(19[2-9]\d|20[0-3]\d)\b/))) { out.years=[+m[1],+m[1]]; out.yearsLabel=m[1]; }
  else if(rx("recent\\w*|nuov\\w*|uscit\\w* da poco|ultim\\w* anni").test(low)) out.era="recent";
  else if(rx("classic\\w*|vecchi\\w*|d'epoca|intramontabil\\w*").test(low)) out.era="classic";
  // 5) qualità
  if(rx("bell[oaie]|capolavor\\w*|premiat\\w*|oscar|acclamat\\w*|di qualit\\w*|imperdibil\\w*").test(low)) out.minRating=7.5;
  // 6) temi → parole chiave TMDB
  for(const [p,en] of NL_KEYWORDS){
    const hit=low.match(rx(p)); if(!hit) continue;
    try{ const r=(await api("/search/keyword",{query:en})).results||[];
      const k=r.find(x=>x.name.toLowerCase()===en)||r[0];
      if(k && !out.keywords.some(x=>x.id===k.id)) out.keywords.push({id:k.id,name:hit[2],en});
    }catch(e){}
  }
  // 7) concetti (cosa vuoi provare guardandolo)
  for(const [id,c] of Object.entries(CONCEPTS)) if(rx(c.re).test(low)) out.concepts.push(id);
  // etichette "Ho capito"
  out.concepts.forEach(id=>out.labels.push(CONCEPTS[id].label));
  out.genres.forEach(g=>out.labels.push(`${GENRE_EMOJI[g]||"🎬"} ${genreName(g)}`));
  out.moods.forEach(x=>out.labels.push(MOODS[x].label));
  out.keywords.forEach(k=>out.labels.push(`🏷 ${k.name}`));
  out.people.forEach(p=>out.labels.push(`${p.role==="crew"?"🎬 regia":"🎭"} ${p.name}`));
  if(out.maxDur) out.labels.push(`⏱ max ${fmtDur(out.maxDur)}`);
  if(out.yearsLabel) out.labels.push(`📅 ${out.yearsLabel}`);
  if(out.era) out.labels.push(out.era==="recent"?"📅 Recenti":"📅 Classici");
  if(out.minRating) out.labels.push(`⭐ ${out.minRating}+`);
  return out;
}
// parametri "discover" da una frase interpretata (per cercare film da aggiungere alle liste, su tutto il catalogo)
function parsedToParams(r){
  const p={language:LANG,sort_by:"popularity.desc",include_adult:false,"vote_count.gte":50};
  if(r.genres.length) p.with_genres=r.genres.join(",");
  else if(r.moods.length) p.with_genres=[...new Set(r.moods.flatMap(m=>MOODS[m].g))].join("|");
  const kw=[...r.keywords.map(k=>k.id),...(isDemo()?[]:(r.concepts||[]).flatMap(c=>CONCEPTS[c].kw))];
  if(kw.length) p.with_keywords=[...new Set(kw)].join("|");
  const notG=[...new Set((r.concepts||[]).flatMap(c=>CONCEPTS[c].not||[]))].filter(g=>!r.genres.includes(g));
  if(notG.length) p.without_genres=notG.join(",");
  if((r.concepts||[]).length){ p.sort_by="vote_count.desc"; if(isDemo()&&!kw.length&&!r.genres.length) return null; }
  const cast=r.people.filter(x=>x.role==="cast"), crew=r.people.filter(x=>x.role==="crew");
  if(cast.length) p.with_cast=cast.map(x=>x.id).join("|");
  if(crew.length) p.with_crew=crew.map(x=>x.id).join("|");
  if(r.maxDur) p["with_runtime.lte"]=r.maxDur;
  if(r.minRating) p["vote_average.gte"]=r.minRating;
  if(r.years){ p["primary_release_date.gte"]=`${r.years[0]}-01-01`; p["primary_release_date.lte"]=`${r.years[1]}-12-31`; }
  else if(r.era==="recent") p["primary_release_date.gte"]="2015-01-01";
  else if(r.era==="classic") p["primary_release_date.lte"]="1999-12-31";
  return p;
}
const understoodHtml = (r,clearable) => r.labels.length
  ? `<div class="understood"><span class="muted">Ho capito:</span>${r.labels.map(l=>`<span class="tag">${esc(l)}</span>`).join("")}${clearable?`<span class="link" data-a="clearDesc">✕ togli</span>`:""}</div>`

// criteri attivi = filtri scelti + quello che si è capito dalla descrizione (campo "Descrivi")
const C = () => { const f=F(), d=prof().descCrit;
  if(!d) return {...f,keywords:[],people:[],concepts:[]};
  const u=(a,b)=>[...new Set([...(a||[]),...(b||[])])];
  const era=f.era!=="all"?f.era:(d.years?"custom":(d.era||"all"));
  return {...f,genres:u(f.genres,d.genres),moods:u(f.moods,d.moods),
    maxDur:f.maxDur&&d.maxDur?Math.min(f.maxDur,d.maxDur):(f.maxDur||d.maxDur||0),
    era,years:era==="custom"?(f.era==="custom"?f.years:d.years):null,
    minRating:Math.max(f.minRating||0,d.minRating||0),
    keywords:d.keywords||[],people:d.people||[],concepts:d.concepts||[]}; };
const moodGenres = () => [...new Set(C().moods.flatMap(m=>MOODS[m].g))];
const moodExcluded = () => { const inc=new Set([...moodGenres(),...C().genres]);
  return [...new Set(C().moods.flatMap(m=>MOODS[m].not||[]))].filter(g=>!inc.has(g)); };
function eraRange(){ const y=new Date().getFullYear();
  if(C().era==="custom" && C().years) return [`${C().years[0]}-01-01`,`${C().years[1]}-12-31`];
  return {classic:[null,"1999-12-31"],"2000":["2000-01-01","2014-12-31"],recent:["2015-01-01",null],new:[`${y-2}-01-01`,null]}[C().era]||[null,null]; }
function discoverParams(){
  const f=C(), [from,to]=eraRange();
  const p={language:LANG,watch_region:REGION,include_adult:false,sort_by:"popularity.desc",
    with_watch_providers:prof().providerIds.join("|"),with_watch_monetization_types:"flatrate",
    "primary_release_date.gte":from,"primary_release_date.lte":to,"with_runtime.lte":f.maxDur||null,
    "vote_average.gte":f.minRating||null,"vote_count.gte":f.popular?MIN_VOTES:20};
  if(f.genres.length) p.with_genres=f.genres.join("|"); else if(f.moods.length) p.with_genres=moodGenres().join("|");
  const not=moodExcluded(); if(not.length) p.without_genres=not.join(",");
  const kw=[...f.keywords.map(k=>k.id),...(isDemo()?[]:f.concepts.flatMap(c=>CONCEPTS[c].kw))];
  if(kw.length) p.with_keywords=[...new Set(kw)].join("|");
  if(f.concepts.length){ p.sort_by="vote_count.desc";
    const notG=f.concepts.flatMap(c=>CONCEPTS[c].not||[]).filter(g=>!f.genres.includes(g));
    p.without_genres=[...new Set([...(p.without_genres?p.without_genres.split(","):[]).map(Number),...notG])].join(",")||undefined; }
  const cast=f.people.filter(x=>x.role==="cast"), crew=f.people.filter(x=>x.role==="crew");
  if(cast.length) p.with_cast=cast.map(x=>x.id).join("|");
  if(crew.length) p.with_crew=crew.map(x=>x.id).join("|");
  return p;
}
const moodOk = ids => !C().moods.length || !C().genres.length || ids.some(g=>moodGenres().includes(g));
function movieMatches(m,ignoreSeen){
  const f=C(), ids=m.genre_ids||[];
  if(f.genres.length && !ids.some(g=>f.genres.includes(g))) return false;
  if(f.moods.length && !ids.some(g=>moodGenres().includes(g))) return false;
  if(moodExcluded().some(g=>ids.includes(g))) return false;
  if(f.maxDur && m.runtime && m.runtime>f.maxDur) return false;
  const [from,to]=eraRange();
  if(m.year && from && m.year<from.slice(0,4)) return false;
  if(m.year && to && m.year>to.slice(0,4)) return false;
  if(m.vote!=null && !m.custom && m.vote<f.minRating) return false;
  if(f.hideSeen && !ignoreSeen && Seen.has(m.id)) return false;
  if(Dismissed.has(m.id)) return false;
  return true;
}
const activeListIds = () => C().sources.filter(s=>s!=="platforms" && Lists.isMember(s));
function listPool(){ // elementi delle liste selezionate, senza doppioni
  const map=new Map();
  for(const lid of activeListIds()){ const l=Lists.get(lid); for(const it of Lists.items(lid)){
    if(!movieMatches(it.movie,l.type==="rewatch")) continue;
    const e=map.get(it.movie.id)||{movie:it.movie,lists:[],addedBy:[]};
    const name=listLabel(l);
    if(!e.lists.includes(name)) e.lists.push(name); if(!e.addedBy.includes(it.added_by)) e.addedBy.push(it.added_by);
    map.set(it.movie.id,e);
  } }
  return [...map.values()];
}
// gusti: generi preferiti + voti 👍/👎 dati in passato
function affinity(genreIds){
  let s=0; const fav=prof().favGenres;
  for(const g of genreIds||[]){ if(fav.includes(g)) s+=1; for(const r of Ratings.mine()) if(r.genre_ids.includes(g)) s+=0.5*r.value; }
  return Math.min(3,Math.max(0.3,1+0.25*s));
}
function weighted(arr,getMovie=x=>x){
  const w=arr.map(x=>{const m=getMovie(x); return Math.pow(Math.max((m.vote||6.5)-3,1),2)*affinity(m.genre_ids);});
  let r=Math.random()*w.reduce((a,b)=>a+b,0), i=0; while(i<arr.length-1 && (r-=w[i])>0) i++; return arr[i];
}
let recent=[];
function remember(id,n){ recent.push(id); if(recent.length>Math.max(1,Math.min(50,Math.floor(n/2)))) recent.shift(); }

async function pickFromPlatforms(){
  if(!prof().providerIds.length) return null;
  const p=discoverParams(), first=await api("/discover/movie",{...p,page:1});
  if(!first.total_results) return null;
  const maxPage=Math.min(first.total_pages,500);
  for(let a=0;a<6;a++){
    const page=a===0?1+Math.floor(Math.random()*maxPage):1+Math.floor(Math.random()*Math.min(maxPage,a*3));
    const data=page===1?first:await api("/discover/movie",{...p,page});
    const cand=data.results.filter(m=>!recent.includes(m.id)&&!(C().hideSeen&&Seen.has(m.id))&&!Dismissed.has(m.id)&&moodOk(m.genre_ids||[])).map(normalize);
    if(cand.length){ const f=weighted(cand); remember(f.id,first.total_results); return await details(f); }
  }
  recent=[]; return null;
}
async function pickFromLists(pool){
  let cand=pool.filter(e=>!recent.includes(e.movie.id)); if(!cand.length) cand=pool;
  for(let i=0;i<10 && cand.length;i++){
    const e=weighted(cand,x=>x.movie), d=await details(e.movie);
    if(!C().onlyAvail || availableToMe(d)){ remember(e.movie.id,pool.length);
      return {...d,origin:{lists:e.lists,addedBy:e.addedBy}}; }
    cand=cand.filter(x=>x!==e);
  }
  return null;
}
async function pick(){
  const sd=R.items.filter(f=>f.seed&&!recent.includes(f.id)&&!(C().hideSeen&&Seen.has(f.id))&&!Dismissed.has(f.id));
  if(sd.length && R.key===resultsKey() && Math.random()<0.6){ const f=weighted(sd); remember(f.id,sd.length*2); return await details(f); }
  const usePlat=C().sources.includes("platforms"), pool=listPool();
  const listFirst=pool.length && (!usePlat || Math.random()<0.5);
  if(listFirst){ const r=await pickFromLists(pool); if(r) return r; }
  if(usePlat){ const r=await pickFromPlatforms(); if(r) return r; }
  if(!listFirst && pool.length) return await pickFromLists(pool);
  return null;
}

let R={key:null,fkey:null,items:[],listCount:0,page:0,totalPages:0,platTotal:0,loading:false,error:null};
const resultsKey = () => JSON.stringify([devKey(),Dismissed.count(),C(),discoverParams(),Seen.ids().length,activeListIds().map(id=>Lists.items(id).length),prof().providerIds]);
const filtersKey = () => JSON.stringify([C(),activeListIds(),prof().providerIds]);
function clearResults(){ R={key:null,fkey:null,items:[],listCount:0,page:0,totalPages:0,platTotal:0,loading:false,error:null}; $("#results").innerHTML=""; }
async function loadResults(reset){
  const c=C(), k0=reset?resultsKey():R.key;
  if(reset){
    R={key:resultsKey(),fkey:filtersKey(),items:[],listCount:0,page:0,totalPages:1,platTotal:0,loading:true,error:null};
    let li=listPool().map(e=>({...e.movie,origin:{lists:e.lists,addedBy:e.addedBy}}));
    if(c.onlyAvail){ const det=await Promise.all(li.slice(0,40).map(m=>details(m).catch(()=>null))); li=li.filter((m,i)=>det[i]&&availableToMe(det[i])); }
    R.items=li; R.listCount=li.length;
    // film di riferimento dei concetti descritti: solo se rispettano i filtri e (se si pesca dalle piattaforme) sono disponibili
    if(c.concepts.length && c.sources.includes("platforms") && prof().providerIds.length){
      let seeds=c.concepts.flatMap(conceptSeeds).filter(m=>!R.items.some(x=>x.id===m.id)&&movieMatches(m));
      seeds=seeds.filter((m,i)=>seeds.findIndex(x=>x.id===m.id)===i).slice(0,30);
      const det=await Promise.all(seeds.map(m=>details(m).catch(()=>null)));
      const ok=seeds.map((m,i)=>det[i]&&availableToMe(det[i])?{...normalize({...det[i],genre_ids:m.genre_ids,poster_path:det[i].poster,backdrop_path:det[i].backdrop,release_date:(det[i].year||"")+"-01-01",vote_average:det[i].vote}),seed:true}:null).filter(Boolean)
        .filter(m=>movieMatches(m));
      if(k0!==R.key) return;
      R.items.push(...ok); R.seedCount=ok.length;
    }
  }
  const k=R.key;
  if(c.sources.includes("platforms") && prof().providerIds.length && R.page<R.totalPages){
    R.loading=true; if(!reset) renderResults();
    try{
      const d=await api("/discover/movie",{...discoverParams(),page:R.page+1});
      if(k!==R.key) return;
      R.page=d.page; R.totalPages=Math.min(d.total_pages,500); R.platTotal=d.total_results;
      const have=new Set(R.items.map(m=>m.id)), seedIds=new Set(R.items.filter(m=>m.seed).map(m=>m.id));
      R.dup=(R.dup||0)+d.results.filter(m=>seedIds.has(m.id)).length;
      R.items.push(...d.results.filter(m=>!have.has(m.id)&&!(c.hideSeen&&Seen.has(m.id))&&!Dismissed.has(m.id)&&moodOk(m.genre_ids||[])).map(normalize));
    }catch(e){ R.error=apiErrorMsg(e); }
  } else if(reset) R.totalPages=0;
  R.loading=false; renderResults();
}
function dropFromResults(id){
  const f=R.items.find(x=>x.id===id); if(!f) return;
  R.items=R.items.filter(x=>x.id!==id);
  if(f.origin) R.listCount--; else if(f.seed) R.seedCount--; else if(R.platTotal) R.platTotal--;
  renderResults();
}
function renderResults(){
  const el=$("#results"), c=C();
  if(!R.key){ el.innerHTML=""; return; }
  const total=Math.max(0,R.listCount+(R.seedCount||0)+(R.platTotal||0)-(R.dup||0));
  const stale = R.fkey!==filtersKey() ? `<div class="stale">Hai cambiato i filtri · <span class="link" data-a="search">aggiorna i risultati</span></div>` : "";
  if(!c.sources.length){ el.innerHTML=stale+`<div class="empty">Seleziona almeno una voce in “Cerca tra”.</div>`; return; }
  if(R.error && !R.items.length){ el.innerHTML=stale+`<div class="empty">${esc(R.error)}</div>`; return; }
  if(!R.items.length){
    if(R.loading){ el.innerHTML=`<div class="empty">Cerco…</div>`; return; }
    const why=[];
    if(c.sources.includes("platforms") && !prof().providerIds.length) why.push(`Non hai selezionato nessuna piattaforma: <span class="link" data-a="goto" data-view="v-profile">scegline almeno una nel Profilo</span>.`);
    if(!c.sources.includes("platforms")) why.push(`Stai cercando solo nelle liste: attiva anche <b>📺 Piattaforme</b> in “Cerca tra”.`);
    if(activeListIds().length && !listPool().length) why.push("Le liste selezionate non hanno film che corrispondono (o sono vuote).");
    if(c.genres.length && c.moods.length) why.push("Genere e mood insieme possono escludersi a vicenda: prova a togliere il mood.");
    if(c.minRating>=7.5) why.push(`Il voto minimo (${c.minRating}+) è alto.`);
    if(c.onlyAvail) why.push("È attivo “Solo film che posso vedere”.");
    if(c.keywords.length||c.people.length) why.push("Temi o persone molto specifici: prova una descrizione più generica.");
    el.innerHTML=stale+`<div class="empty">😕 Nessun film corrisponde.${why.length?`<div class="hint" style="text-align:left;margin-top:10px">${why.map(w=>"• "+w).join("<br>")}</div>`:"<br>Prova ad allargare la ricerca."}</div>`;
    return; }
  const row=f=>`<div class="item ritem" data-a="openDetail" data-id="${f.id}">${thumbHtml(f)}
    <div class="info"><div class="t">${esc(f.title)}</div>
      <div class="muted">${[f.year,fmtDur(f.runtime),f.vote?`⭐ ${f.vote.toFixed(1)}`:"",(f.genre_ids||[]).map(genreName).filter(Boolean).slice(0,2).join(", ")].filter(Boolean).join(" · ")}</div>
      ${f.origin?`<div class="origin-mini">📋 ${f.origin.lists.map(esc).join(" · ")}</div>`:""}</div><span class="muted">›</span></div>`;
  const lists=R.items.filter(f=>f.origin), seeds=R.items.filter(f=>f.seed), plats=R.items.filter(f=>!f.origin&&!f.seed);
  el.innerHTML=`${stale}<div class="reshead" id="resTop"><b>${total.toLocaleString("it-IT")} film</b></div>
    ${lists.length?`<div class="ressub">Dalle tue liste</div><div class="section">${lists.map(row).join("")}</div>`:""}
    ${seeds.length?`<div class="ressub">✨ I più vicini a quello che hai descritto</div><div class="section">${seeds.map(row).join("")}</div>`:""}
    ${plats.length?`<div class="ressub">${seeds.length?"Altri sulle tue piattaforme":"Sulle tue piattaforme"}</div><div class="section">${plats.map(row).join("")}</div>`:""}
    ${R.page<R.totalPages?`<button class="btn ghost" data-a="moreResults" style="margin-top:10px" ${R.loading?"disabled":""}>${R.loading?"Carico…":"Carica altri"}</button>`:""}`;
}

// ricerca unica: titolo + persona + descrizione in parallelo, risultati raggruppati
const doSearch=debounce(async()=>{
  const q=$("#listSearch")?.value.trim(); if(q===undefined) return;
  if(q.length<2){ $("#sugg").innerHTML=""; return; }
  $("#sugg").innerHTML=`<p class="muted">Cerco…</p>`;
  try{
    const words=q.split(/\s+/);
    const [byTitle,ppl,parsed]=await Promise.all([
      api("/search/movie",{query:q,language:LANG,include_adult:false}).then(r=>r.results).catch(()=>[]),
      words.length<=3 ? api("/search/person",{query:q,language:LANG}).then(r=>r.results||[]).catch(()=>[]) : [],
      parseQuery(q).catch(()=>null),
    ]);
    const sections=[], seen=new Set();
    const add=(head,list,max)=>{ const items=list.map(normalize).filter(f=>!seen.has(f.id)).slice(0,max); items.forEach(f=>seen.add(f.id)); if(items.length) sections.push({head,items}); };
    // persona affidabile: tutte le parole nel nome e, se è una parola sola, deve essere un nome/cognome intero di una persona nota
    const person=ppl.find(x=>{ const toks=fold(x.name).split(/[\s.-]+/);
      return words.every(w=>fold(x.name).includes(fold(w))) && (words.length>1 ? (x.popularity??1)>=1 : toks.includes(fold(words[0])) && (x.popularity??0)>=3); });
    const tasks=[];
    if(person){ const dir=person.known_for_department==="Directing";
      tasks.push(api("/discover/movie",{language:LANG,sort_by:"popularity.desc",include_adult:false,[dir?"with_crew":"with_cast"]:person.id})
        .then(r=>({head:`${dir?"🎬 Film diretti da":"🎭 Film con"} ${esc(person.name)}`,list:r.results})).catch(()=>null)); }
    const useDesc=parsed && parsed.labels.length && !(person && parsed.people.length===parsed.labels.length);
    const seedList=useDesc?(parsed.concepts||[]).flatMap(conceptSeeds):[];
    const dp=useDesc?parsedToParams(parsed):null;
    if(useDesc) tasks.push((dp?api("/discover/movie",dp).then(r=>r.results).catch(()=>[]):Promise.resolve([]))
      .then(list=>({head:`✨ Ho capito: ${parsed.labels.map(esc).join(" · ")}`,list:[...seedList.map(m=>({id:m.id,title:m.title,release_date:m.year?m.year+"-01-01":"",poster_path:m.poster,genre_ids:m.genre_ids,vote_average:m.vote})),...list]})));
    const extra=(await Promise.all(tasks)).filter(Boolean);
    if(q!==$("#listSearch")?.value.trim()) return;
    // titoli: prima quelli conosciuti; quelli senza voti solo se non c'è altro
    const known=byTitle.filter(m=>(m.vote_count??1)>=10), titles=known.length?known:byTitle;
    const strongTitle=titles.some(m=>(m.vote_count??1000)>=200 && fold(m.title||"").includes(fold(q)));
    if(person && !strongTitle){ extra.forEach(x=>add(x.head,x.list,8)); add("🔤 Titoli",titles,4); }
    else { add("🔤 Titoli",titles,6); extra.forEach(x=>add(x.head,x.list,8)); }
    searchSections=sections; searchResults=sections.flatMap(x=>x.items); renderSugg();
  }catch(e){ $("#sugg").innerHTML=`<p class="muted">${esc(apiErrorMsg(e))}</p>`; }
},450);
function renderSugg(){
  $("#sugg").innerHTML=searchSections.length?searchSections.map(sec=>`<div class="muted" style="margin:12px 0 2px;font-weight:600">${sec.head}</div>`+
    sec.items.map(f=>`<div class="item">${thumbHtml(f)}
      <div class="info"><div class="t">${esc(f.title)}</div><div class="muted">${f.year||"—"}${f.vote?` · ⭐ ${f.vote.toFixed(1)}`:""}</div></div>
      ${Lists.has(openListId,f.id)?`<span class="muted">in lista</span>`:`<button class="icon" data-a="addSearch" data-id="${f.id}">➕</button>`}</div>`).join("")).join("")
    :`<p class="muted">Nessun film trovato. Prova con un'altra parola o aggiungilo a mano qui sotto.</p>`;
}

const SW = {l:{verdict:"seen",stamp:"Già visto"}, r:{verdict:"not_seen",stamp:"Non visto"}, d:{verdict:"dismiss",stamp:"Escludi"}, h:{verdict:"want",stamp:"❤️ In lista"}};
const Swipes = {
  mine(){ const me=Auth.current().id; return D().swipes.filter(x=>x.user_id===me); },
  has(movieId){ return Swipes.mine().some(x=>x.movie_id===movieId); },
  add(movie,verdict){ D().swipes.push({user_id:Auth.current().id,game:"seen",movie_id:movie.id,verdict,movie:liteMovie(movie),at:Date.now()}); DB.save(); },
  removeLast(){ const me=Auth.current().id; for(let i=D().swipes.length-1;i>=0;i--){ if(D().swipes[i].user_id===me){ return D().swipes.splice(i,1)[0]; } } return null; },
  count(verdict){ return Swipes.mine().filter(x=>x.verdict===verdict).length; },
};
let G=null; // mazzo di carte dell'utente corrente
const inAnyList = id => Lists.owned().some(l=>Lists.has(l.id,id));
const deckOk = m => !Swipes.has(m.id) && !Seen.has(m.id) && !Dismissed.has(m.id) && !inAnyList(m.id);
function renderDiscover(){
  if(!me()) return;
  if(!G){ G={deck:[],page:prof().scopriPage||0,done:false,loading:false,history:[]}; refillDeck(); }
  renderGame();
}
async function refillDeck(){
  if(!G || G.loading || G.done) return; G.loading=true; const g=G;
  try{
    let tries=0;
    while(g===G && g.deck.length<8 && !g.done && tries<8){
      tries++; g.page++;
      const d=await api("/discover/movie",{language:LANG,include_adult:false,sort_by:"vote_count.desc",page:g.page});
      if(g!==G) return;
      g.deck.push(...d.results.map(normalize).filter(m=>deckOk(m)&&!g.deck.some(x=>x.id===m.id)));
      prof().scopriPage=Math.max(0,g.page-2); save();
      if(g.page>=Math.min(d.total_pages,500)) g.done=true;
    }
  }catch(e){ toast(apiErrorMsg(e)); }
  if(g===G){ g.loading=false; renderGame(); }
}

    ${m.poster?`<img src="${img(m.poster,"w500")}" alt="" onerror="this.remove()">`:""}
    ${back?"":`<span class="stamp r" id="stR">${SW.r.stamp}</span><span class="stamp l" id="stL">${SW.l.stamp}</span><span class="stamp d" id="stD">${SW.d.stamp}</span>`}
    <div class="cap"><h3>${esc(m.title)}</h3><div class="muted">${[m.year,(m.genre_ids||[]).map(genreName).filter(Boolean).slice(0,2).join(", "),m.vote?`⭐ ${m.vote.toFixed(1)}`:""].filter(Boolean).join(" · ")}</div></div>
  </div>`;
}

function bindDrag(card){
  let sx=0,sy=0,dx=0,dy=0,drag=false,lastTap=0;
  const st={r:$("#stR"),l:$("#stL"),d:$("#stD")};
  const dirOf=()=> dy>110&&dy>Math.abs(dx) ? "d" : dx>100 ? "r" : dx<-100 ? "l" : null;
  const reset=()=>{ card.style.transition="transform .25s"; card.style.transform=""; Object.values(st).forEach(x=>x.style.opacity=0); };
  card.addEventListener("pointerdown",e=>{ drag=true; sx=e.clientX; sy=e.clientY; dx=dy=0; card.setPointerCapture(e.pointerId); card.style.transition="none"; });
  card.addEventListener("pointermove",e=>{ if(!drag) return; dx=e.clientX-sx; dy=e.clientY-sy;
    card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    st.r.style.opacity=Math.max(0,Math.min(1,dx/110)); st.l.style.opacity=Math.max(0,Math.min(1,-dx/110));
    st.d.style.opacity=dy>Math.abs(dx)?Math.max(0,Math.min(1,dy/130)):0; });
  const end=()=>{ if(!drag) return; drag=false;
    if(Math.abs(dx)<8 && Math.abs(dy)<8){ reset(); const now=Date.now(); if(now-lastTap<350){ lastTap=0; flyOut("h"); } else lastTap=now; return; }
    const d=dirOf(); if(d) flyOut(d); else reset(); };
  card.addEventListener("pointerup",end); card.addEventListener("pointercancel",end);
}
function flyOut(dir){
  const card=$("#topCard"); if(!card||!G||card.dataset.out) return; card.dataset.out=1;
  if(dir==="h"){ const h=document.createElement("div"); h.className="heartpop"; h.textContent="❤️"; card.appendChild(h);
    setTimeout(()=>{ card.style.transition="transform .3s ease-in"; card.style.transform="translate(0,-130%) scale(.9)"; },380);
    return setTimeout(()=>commitSwipe(dir),640); }
  const st={r:"#stR",l:"#stL",d:"#stD"}[dir]; $(st).style.opacity=1;
  card.style.transition="transform .3s ease-in";
  card.style.transform=dir==="r"?"translate(140%,-10%) rotate(25deg)":dir==="l"?"translate(-140%,-10%) rotate(-25deg)":"translate(0,130%)";
  setTimeout(()=>commitSwipe(dir),260);
}
function commitSwipe(dir){
  if(!G) return; const m=G.deck.shift(); if(!m) return; const verdict=SW[dir].verdict;
  Swipes.add(m,verdict);
  if(verdict==="seen") Seen.set(m.id,true,m);
  if(verdict==="dismiss") Dismissed.set(m.id,true);
  if(verdict==="want") Lists.add(Lists.personal().id,m);
  G.history.push({m,verdict}); buzz(8);
  if(verdict==="want") toast(`❤️ “${m.title}” salvato nella tua lista`);
  renderGame();
  if(G.deck.length<5) refillDeck();
}
function undoSwipe(){
  if(!G||!G.history.length) return; const {m,verdict}=G.history.pop();
  Swipes.removeLast();
  if(verdict==="seen") Seen.set(m.id,false);
  if(verdict==="dismiss") Dismissed.set(m.id,false);
  if(verdict==="want") Lists.removeItem(Lists.personal().id,m.id);
  G.deck.unshift(m); renderGame();
}

/* =====================================================================
   12c. GAME – Cine-quiz del giorno
   Ogni giorno da 1 a 5 domande (uguali per tutti), 15 secondi ciascuna (10 per vero/falso).
   Punti: 100 + 10 per ogni secondo rimasto. La domenica c'è una domanda bonus che vale doppio.
   I punti si sommano dal lunedì alla domenica: a fine settimana c'è la classifica finale.
   In produzione: domande e classifica sul server (niente trucchi) e notifiche
   "nuove domande!" / "classifica finale".
   ===================================================================== */
function seeded(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); h^=h>>>16; return (h>>>0)/4294967296; }; }
function shuffled(arr,rnd){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseDay=k=>{ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
function weekStart(d=new Date()){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-(x.getDay()+6)%7); return x; }
const weekKey=(d=new Date())=>dayKey(weekStart(d));
const isLastDay=(d=new Date())=>d.getDay()===0;
const questionsCount=(d=new Date())=>1+Math.floor(seeded("n"+dayKey(d))()*5);
function dailyQuestions(d=new Date()){
  const wk=weekKey(d), di=(d.getDay()+6)%7, n=questionsCount(d);
  const order=shuffled(QUIZ.map((_,i)=>i),seeded("w"+wk));          // stessa sequenza per tutti, nessuna ripetizione nella settimana
  const qs=order.slice(di*5,di*5+n).map(i=>({...QUIZ[i],idx:i}));
  if(isLastDay(d)){ const b=shuffled(QBONUS.map((_,i)=>i),seeded("b"+wk))[0]; qs.push({...QBONUS[b],idx:"b"+b,bonus:true}); }
  return qs.map((q,k)=>({...q,opts:shuffled(q.a,seeded(dayKey(d)+":"+k))}));
}
const qTime = q => q.t || (q.c==="tf"?10:15);
const Quiz = {
  rec(day=dayKey(),userId=me().id){ return D().quiz.find(r=>r.user_id===userId&&r.day===day); },
  weekPoints(userId,wk){ return D().quiz.filter(r=>r.user_id===userId&&r.week===wk).reduce((s,r)=>s+r.points,0); },
};
// prototipo: giocatori simulati per vedere una classifica "viva"
const BOTS=["cinefilo88","popcornqueen","nolanfan","la.dolce.vita","darthvale","mr.tarantino","ghibli.girl","sofa.critic"];
function botPoints(name,wk,upto){
  let s=0; const start=parseDay(wk), skill=0.35+seeded(name)()*0.5;
  for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); if(dayKey(d)>upto) break;
    const r=seeded(name+dayKey(d)); if(r()<0.25) continue;
    const n=questionsCount(d)+(isLastDay(d)?1:0);
    for(let k=0;k<n;k++) if(r()<skill) s+=(100+10*Math.floor(r()*14))*(isLastDay(d)&&k===n-1?2:1); }
  return s;
}
function leaderboard(wk,upto){
  const rows=D().users.filter(u=>u.provider!=="guest"||u.id===me().id).map(u=>({id:u.id,user:u,name:handle(u)||u.name,pts:Quiz.weekPoints(u.id,wk)}))
    .filter(r=>r.pts>0||r.id===me().id);
  BOTS.forEach(b=>rows.push({id:"bot_"+b,name:"@"+b,bot:true,pts:botPoints(b,wk,upto)}));
  return rows.sort((a,b)=>b.pts-a.pts||(a.id===me().id?-1:1));
}
function lbHtml(rows,limit=10){
  const mePos=rows.findIndex(r=>r.id===me().id), medal=["🥇","🥈","🥉"];
  const show=rows.slice(0,limit); if(mePos>=limit) show.push(rows[mePos]);
  return show.map(r=>{ const pos=rows.indexOf(r);
    return `<div class="item ${r.id===me().id?"me":""}"><span class="pos">${medal[pos]||pos+1}</span>${r.user?avatar(r.user):`<span class="av" style="background:hsl(${hue(r.name)} 45% 40%)">${esc(r.name[1].toUpperCase())}</span>`}
      <div class="info"><div class="t">${esc(r.name)}${r.id===me().id?" (tu)":""}</div></div><span class="pts">${r.pts.toLocaleString("it-IT")}</span></div>`; }).join("");
}
let QZ=null; // partita in corso
function renderQuiz(){
  const v=$("#v-quiz"); if(!v||!me()) return;
  if(QZ) return renderQuestion();
  const today=dayKey(), wk=weekKey(), rec=Quiz.rec();
  if(rec && !rec.done){ rec.done=true; save(); }            // partita interrotta: valgono solo le risposte già date
  const qs=dailyQuestions(), lb=leaderboard(wk,today), pos=lb.findIndex(r=>r.id===me().id)+1, myPts=Quiz.weekPoints(me().id,wk);
  const daysLeft=6-((new Date().getDay()+6)%7);
  const prevStart=weekStart(); prevStart.setDate(prevStart.getDate()-7); const prevEnd=new Date(prevStart); prevEnd.setDate(prevEnd.getDate()+6);
  const plb=leaderboard(dayKey(prevStart),dayKey(prevEnd)), pme=plb.findIndex(r=>r.id===me().id)+1;
  const ok=rec?rec.answers.filter(a=>a.ok).length:0;
  v.innerHTML=`
    <div class="qhero"><div class="big">🎬</div><h2>Cine-quiz del giorno</h2>
      ${rec?`<div style="font-size:16px">Oggi hai fatto <b>${rec.points} punti</b></div><div style="color:#e0d6ff;margin-top:4px">${ok} rispost${ok===1?"a":"e"} giust${ok===1?"a":"e"} su ${rec.total}</div>
             <div style="color:#e0d6ff;margin-top:10px;font-size:13px">${daysLeft?"Nuove domande domani 🍿":"Stanotte a mezzanotte la classifica diventa definitiva!"}</div>`
           :`<div style="font-size:16px">Oggi: <b>${qs.length} domand${qs.length>1?"e":"a"}</b> sul cinema</div>
             <div style="color:#e0d6ff;margin-top:4px;font-size:13px">Hai pochi secondi per ognuna: più sei veloce, più punti fai</div>
             ${isLastDay()?`<div class="qflag">⭐ Oggi c'è la domanda BONUS che vale doppio!</div>`:""}
             <button class="btn white" data-a="quizStart" style="margin-top:14px">▶ Gioca</button>`}
      <div class="qstat"><div><b>${myPts.toLocaleString("it-IT")}</b>punti settimana</div><div><b>${pos?"#"+pos:"–"}</b>in classifica</div><div><b>${daysLeft}</b>${daysLeft===1?"giorno":"giorni"} alla fine</div></div>
    </div>
    <h2>🏆 Classifica della settimana</h2><div class="section lb">${lbHtml(lb)}</div>
    <h2>🥇 Podio della settimana scorsa</h2><div class="section lb">${lbHtml(plb,3)}</div>
    ${pme>3?`<p class="muted">La settimana scorsa sei arrivato/a ${pme}°.</p>`:""}
    <p class="muted" style="line-height:1.5;margin-top:14px"><b>Come funziona</b> · Ogni giorno da 1 a 5 domande, uguali per tutti. Ogni risposta giusta vale 100 punti più 10 per ogni secondo che ti avanza. I punti si sommano dal lunedì alla domenica; la domenica c'è una domanda bonus che vale doppio. Si gioca una volta al giorno: se esci a metà, valgono solo le risposte date.</p>
    <p class="muted" style="font-size:12px">Prototipo: in classifica ci sono anche giocatori simulati.</p>`;
}
function quizStart(){
  if(Quiz.rec()) return renderQuiz();
  const qs=dailyQuestions();
  const rec={user_id:me().id,day:dayKey(),week:weekKey(),answers:[],points:0,total:qs.length,done:false};
  D().quiz.push(rec); save();
  QZ={qs,i:0,rec,t0:0,timer:null}; nextQuestion();
}
function nextQuestion(){
  if(QZ.i>=QZ.qs.length) return finishQuiz();
  QZ.t0=Date.now(); renderQuestion(); clearInterval(QZ.timer); QZ.timer=setInterval(quizTick,100);
}
function quizTick(){
  if(!QZ) return; const q=QZ.qs[QZ.i], T=qTime(q)*1000, left=Math.max(0,T-(Date.now()-QZ.t0));
  const bar=$("#qbar"); if(bar) bar.style.width=(left/T*100)+"%";
  const s=$("#qsec"); if(s) s.textContent=Math.ceil(left/1000);
  const im=$("#qimg"); if(im) im.style.filter=`blur(${(3+17*left/T).toFixed(1)}px)`;   // la locandina si schiarisce col tempo
  if(left<=0) quizAnswer(-1);
}
function quizAnswer(k){
  if(!QZ) return; clearInterval(QZ.timer); if(k>=0) buzz(10);
  const q=QZ.qs[QZ.i], left=Math.max(0,qTime(q)-(Date.now()-QZ.t0)/1000), ok=k>=0 && q.opts[k]===q.a[0];
  const pts=ok?(100+10*Math.floor(left))*(q.bonus?2:1):0;
  QZ.rec.answers.push({q:q.idx,ok,pts}); QZ.rec.points+=pts; save();
  QZ.i++; nextQuestion();
}
function finishQuiz(){ clearInterval(QZ.timer); QZ.rec.done=true; save(); QZ=null; renderQuiz(); }
function stopQuiz(){ if(QZ){ clearInterval(QZ.timer); QZ=null; } }
function renderQuestion(){
  const q=QZ.qs[QZ.i], T=qTime(q);
  $("#v-quiz").innerHTML=`<div class="qbox">
    <div class="qtop"><span>Domanda ${QZ.i+1} di ${QZ.qs.length}</span><span>⏱ <b id="qsec">${T}</b> s</span></div>
    <div class="qbar"><i id="qbar"></i></div>
    <div>${q.bonus?`<span class="qcat qbonus">⭐ BONUS · vale doppio</span> `:""}<span class="qcat">${QCAT[q.c]}</span></div>
    <p class="qq">${esc(q.q)}</p>
    ${q.e?`<div class="qemoji">${q.e}</div>`:""}
    ${q.p&&DEMO_POSTERS[q.p]?`<div class="qposter"><img id="qimg" src="${img(DEMO_POSTERS[q.p][0],"w342")}" alt="" style="filter:blur(20px)"></div>`:""}
    <div class="qopts">${q.opts.map((o,k)=>`<button class="qopt" data-a="qAns" data-k="${k}">${esc(o)}</button>`).join("")}</div>
  </div>`;
}

  switchUser:d=>{ Auth.login(d.id); current=null; recent=[]; G=null; stopQuiz(); clearResults(); openListId=null;
    if(onb && prof().onboarded){ endOnboarding(); consumeInvite(); } else if(!prof().onboarded){ startOnboarding("platforms"); } else { renderAll(); goTo("v-pick"); }
    toast("Ciao "+me().name+"!"); },
  newUser:()=>{ Auth.logout(); current=null; G=null; stopQuiz(); clearResults(); startOnboarding("auth"); },
  saveKey:async()=>{ localStorage.setItem(DEV_KEY,$("#apiKey").value.trim()); await reconnect(true); },
  clearKey:async()=>{ localStorage.removeItem(DEV_KEY); await reconnect(true); },
  resetAll:()=>{ if(confirm("Cancellare utenti, liste e dati del prototipo?")){ localStorage.removeItem(DB_KEY); DB.load(); current=null; G=null; stopQuiz(); clearResults(); startOnboarding("welcome"); } },
  closeSheet:()=>closeSheet(),
  // --- onboarding
  onbGo:d=>{ onb.step=d.step; renderOnb(); },
  onbMethod:d=>{ userEdited=false; if(d.m==="guest"){ Auth.signUp({name:"Ospite",email:null,provider:"guest"}); onb.step="avatar"; renderOnb(); return; }
    onb.method=d.m||null; renderOnb(); },
  onbAuth:()=>{
    const name=$("#oName").value.trim(); if(!name) return fieldErr("oName","Dimmi come ti chiami");
    const username=Usernames.norm($("#oUser").value);
    let email;
    if(onb.method==="email"){ email=$("#oEmail").value.trim();
      if(!/^\S+@\S+\.\S+$/.test(email)) return fieldErr("oEmail","Email non valida: controlla la @ e il dominio (es. nome@gmail.com)");
      if(($("#oPwd").value||"").length<8) return fieldErr("oPwd","La password deve avere almeno 8 caratteri");
      const ex=Auth.byEmail(email); if(!ex){ const err=Usernames.error(username); if(err) return fieldErr("oUser",err); }
      if(ex){ Auth.login(ex.id); toast("Bentornato "+ex.name); if(prof().onboarded){ endOnboarding(); consumeInvite(); } else { onb.step="platforms"; renderOnb(); } return; }
    } else { email=name.toLowerCase().replace(/\s+/g,".")+(onb.method==="apple"?"@icloud.com":"@gmail.com");
      const err=Usernames.error(username); if(err) return fieldErr("oUser",err); }
    Auth.signUp({name,email,provider:onb.method,username}); onb.step="avatar"; onb.method=null; renderOnb();
  },
  // tocco su una locandina: si aggiorna solo quella (lo schermo non si sposta)
  onbSeen:(d,el)=>{ const id=+d.id, f=onb.seenTiles.find(x=>x.id===id), on=!Seen.has(id);
    Seen.set(id,on,f); el.classList.toggle("on",on); $("#onb .onbfoot").innerHTML=seenFoot(); },
  onbFinish:()=>{ prof().onboarded=true; save(); endOnboarding();
    if(pendingInvite){ const r=Lists.joinByLink(pendingInvite); pendingInvite=null;
      if(r.list){ openListId=r.list.id; renderAll(); goTo("v-lists"); toast(r.error||`Ora hai “${listLabel(r.list)}”`); } else toast(r.error); } },
  joinLink:d=>{ const r=Lists.joinByLink(d.code); closeSheet(); toast(r.error||`Ora hai “${listLabel(r.list)}”`); if(r.list){ openListId=r.list.id; renderAll(); goTo("v-lists"); } },
};
let onbRateNext=true;
// errore mostrato sotto il campo sbagliato (non in un toast lontano)
function fieldErr(id,msg){
  document.querySelectorAll("#onb .ferr").forEach(x=>x.remove());
  document.querySelectorAll("#onb [aria-invalid]").forEach(x=>x.removeAttribute("aria-invalid"));
  const i=$("#"+id); if(!i) return toast(msg);
  i.setAttribute("aria-invalid","true");
  const e=document.createElement("div"); e.className="ferr"; e.setAttribute("role","alert"); e.textContent=msg;
  ($("#"+id+"Msg")||i).after(e); i.focus();
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el || el.disabled) return;
  const fn=A[el.dataset.a]; if(!fn) return;
  fn(el.dataset,el,e);
});
// Invio o Spazio attivano chip e link (che non sono <button>)
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ") && e.target.matches?.("[data-a][tabindex]:not(button)")){ e.preventDefault(); e.target.click(); } });
// frecce da tastiera per le carte di Scopri (utile da computer)
document.addEventListener("keydown",e=>{ if(!G || !$("#v-discover").classList.contains("on") || $("#v-discover .tut") || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  const d={ArrowRight:"r",ArrowLeft:"l",ArrowDown:"d",ArrowUp:"h"}[e.key]; if(d){ e.preventDefault(); flyOut(d); } });
let userEdited=false;
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="descBox") renderDescOut();
  if(id==="oName"||id==="uName"){ const f=$(id==="oName"?"#oUser":"#uUser"); if(f && !userEdited){ f.value=e.target.value.trim()?Usernames.suggest(e.target.value):""; checkUser(f); } }
  if(id==="oUser"||id==="uUser"||id==="eUser"){ userEdited=true; checkUser(e.target); }
});
function checkUser(input){
  const msg=$("#"+input.id+"Msg"); if(!msg) return;
  const un=Usernames.norm(input.value); if(!un){ msg.textContent=""; return; }
  const err=Usernames.error(un,input.id==="eUser"?me()?.id:undefined);
  msg.innerHTML = err ? `<span style="color:#ff8a8d">✕ ${esc(err)}</span>` : `<span style="color:var(--ok)">✓ @${esc(un)} è disponibile</span>`;
}
$("#descBox").addEventListener("keydown",e=>{ if(e.key==="Enter"){ $("#descBox").blur(); doPick(); } });
$("#fDuration").onchange=e=>{ F().maxDur=+e.target.value; save(); renderPick(); };
$("#fEra").onchange=e=>{ F().era=e.target.value; save(); renderPick(); };
$("#fRating").onchange=e=>{ F().minRating=+e.target.value; save(); renderPick(); };
$("#fHideSeen").onchange=e=>{ F().hideSeen=e.target.checked; save(); renderPick(); };
$("#fPopular").onchange=e=>{ F().popular=e.target.checked; save(); renderPick(); };
$("#fOnlyAvail").onchange=e=>{ F().onlyAvail=e.target.checked; save(); renderPick(); };

async function reconnect(verbose){
  memo.clear(); metaOk=false; G=null; if(me()) clearResults();
  connInfo=null;
  try{ await loadMeta(); if(verbose) toast(isDemo()?"Uso il catalogo demo":"✅ Connesso a TMDB"); }
  catch(e){ GENRES=BASE_GENRES; connInfo=diagnose(e); if(verbose) toast("❌ "+connInfo.title); }
  if(onb){ if(["platforms","seen"].includes(onb.step)) renderOnb(); } else renderAll();
}

/* =====================================================================
   14. AVVIO
   ===================================================================== */
DB.load();
if(!me()) startOnboarding("welcome");
else if(!prof().onboarded) startOnboarding("platforms");
else { renderAll(); consumeInvite(); }
reconnect(false);
</script>
