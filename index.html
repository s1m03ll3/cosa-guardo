<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>CosaGuardo</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#20242d; --line:#2a2f3a;
    --text:#eef0f4; --muted:#9aa1ad; --accent:#ff5a5f; --accent2:#ffb347; --ok:#3ecf8e; --gold:#f5c542;
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding-bottom:84px}
  a{color:var(--accent2)}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
  header h1{font-size:22px;margin:0;letter-spacing:-.3px}
  header h1 span,.logo span{color:var(--accent)}
  .pill{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:99px;cursor:pointer}
  .pill.ok{color:var(--ok);border-color:var(--ok)}
  .pill.gold{color:var(--gold);border-color:var(--gold)}
  h2{font-size:15px;margin:22px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center}
  .section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:8px 12px;border-radius:99px;font-size:14px;cursor:pointer;user-select:none;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.plat.on,.chip.src.on{background:#2d5cff;border-color:#2d5cff}
  .logo-img{width:22px;height:22px;border-radius:6px;pointer-events:none;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
  .row{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:12px 0}
  .row label{font-size:14px}
  select,input[type=text],input[type=email],input[type=number],input[type=password]{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;width:100%}
  .row select{width:auto}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .switch{position:relative;width:44px;height:26px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
  .switch span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked+span{background:var(--ok)}
  .switch input:checked+span:before{transform:translateX(18px)}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;text-align:center;
       background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px rgba(255,90,95,.25)}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line);font-weight:600;font-size:14px;padding:12px;color:var(--text)}
  .btn.danger{background:transparent;box-shadow:none;border:1px solid #6b2a2c;color:#ff8a8d;font-size:14px;padding:12px}
  .btn.white{background:#fff;color:#111;box-shadow:none}
  .btn.dark{background:#000;color:#fff;box-shadow:none;border:1px solid #333}
  .btn.sm{width:auto;display:inline-block;padding:9px 14px;font-size:14px}
  .stack>*+*{margin-top:10px}
  .btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .muted{color:var(--muted);font-size:13px}
  .count{font-size:13px;color:var(--muted);text-align:center;margin:10px 0 0;min-height:18px}
  .banner{background:#3a2a10;border:1px solid #7a5a1a;color:#ffd58a;border-radius:12px;padding:12px;font-size:14px;margin-bottom:6px;cursor:pointer}
  .adbanner{margin-top:18px;border:1px dashed #555;border-radius:12px;padding:12px;text-align:center;font-size:12px;color:var(--muted)}
  .adbanner b{display:block;color:var(--text);font-size:14px;margin:2px 0}
  /* result */
  .result{margin-top:18px;border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--line);animation:pop .35s ease}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .hero{position:relative;min-height:210px;display:flex;align-items:flex-end;gap:14px;padding:16px;background-size:cover;background-position:center}
  .hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,17,21,.1),rgba(24,27,34,.95))}
  .hero>*{position:relative}
  .hero .poster{width:96px;height:144px;border-radius:10px;object-fit:cover;box-shadow:0 6px 20px rgba(0,0,0,.5);flex:none;background:var(--card2)}
  .hero .bigemoji{position:absolute;right:16px;top:10px;font-size:60px}
  .hero h3{margin:0 0 4px;font-size:22px;line-height:1.15;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .hero .tagline{font-size:13px;color:#d6d9e0;font-style:italic}
  .meta{padding:6px 16px 16px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
  .tag{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
  .origin{font-size:13px;background:#1d2a45;border:1px solid #2d4370;color:#bcd0ff;border-radius:10px;padding:7px 10px;margin:4px 0 10px}
  .provs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 12px}
  .prov{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:4px 8px 4px 4px}
  .prov.mine{border-color:var(--ok)}
  .plot{font-size:15px;line-height:1.45;margin:0}
  .empty{text-align:center;padding:26px 14px;color:var(--muted)}
  /* list items */
  .item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .thumb{width:44px;height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;overflow:hidden;position:relative}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .item .info{flex:1;min-width:0}
  .item .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item.seen .t{text-decoration:line-through;color:var(--muted)}
  .icon{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:16px;flex:none}
  .listcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;margin-bottom:10px}
  .listcard .lic{width:46px;height:46px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
  .listcard .info{flex:1;min-width:0}
  .listcard .t{font-weight:700;font-size:16px}
  .avs{display:flex}
  .av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;border:2px solid var(--card);margin-left:-6px;flex:none}
  .avs .av:first-child{margin-left:0}
  .av.lg{width:56px;height:56px;font-size:24px;border:0;margin:0}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:24px;letter-spacing:4px;font-weight:700;text-align:center;background:var(--card2);border-radius:12px;padding:12px;margin:8px 0}
  .back{background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:0;margin:4px 0 8px}
  /* nav */
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);
      display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
  nav .in{display:flex;max-width:560px;width:100%}
  nav button{flex:1;background:none;border:0;color:var(--muted);font-size:12px;padding:6px;cursor:pointer}
  nav button b{display:block;font-size:22px;margin-bottom:2px}
  nav button.on{color:var(--text)}
  nav button b{position:relative}
  .badge{position:absolute;top:-4px;right:-10px;min-width:18px;height:18px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}
  .view{display:none}.view.on{display:block}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:#111;padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
  /* sheet */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.on{display:flex}
  .sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet h3{margin:0 0 6px;font-size:19px}
  .opt{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;background:var(--card2)}
  .opt.on{border-color:var(--accent);background:#2a1a1c}
  .opt .lic{font-size:24px}
  /* onboarding */
  .onb{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;display:none}
  .onb.on{display:block}
  .onb .wrap{min-height:100%;display:flex;flex-direction:column;padding-top:28px;padding-bottom:30px}
  .onb .body{flex:1}
  .onb h2.big{font-size:26px;color:var(--text);text-transform:none;letter-spacing:-.3px;margin:8px 0 6px;display:block}
  .dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .dots i.on{background:var(--accent);width:20px;border-radius:99px}
  .hero-emoji{font-size:84px;text-align:center;margin:40px 0 10px}
  .logo{font-size:34px;font-weight:800;text-align:center;letter-spacing:-.5px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tile{aspect-ratio:2/3;border-radius:10px;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:flex-end;padding:6px;font-size:12px;font-weight:600;border:2px solid transparent}
  .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tile span{position:relative;text-shadow:0 1px 6px #000}
  .tile.on{border-color:var(--ok)}
  .tile.on:after{content:"✓";position:absolute;top:6px;right:6px;background:var(--ok);color:#000;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
  /* loader + ad */
  .loader{position:fixed;inset:0;background:rgba(10,11,14,.97);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .loader.on{display:flex}
  .reel{font-size:72px;height:96px;animation:bounce .5s ease infinite alternate}
  @keyframes bounce{to{transform:translateY(-8px) rotate(-6deg)}}
  .loader .msg{font-size:17px;font-weight:600;margin:8px 0 20px;min-height:24px}
  .adbox{width:100%;max-width:400px;border-radius:16px;overflow:hidden;border:1px solid #333;background:#16181d}
  .adbox .adlbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#888;padding:8px 12px;display:flex;justify-content:space-between}
  .adbox .adcreative{height:210px;background:linear-gradient(135deg,#3b2b6b,#1b6b7b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff}
  .adbox .adcreative b{font-size:20px}
  .adbar{height:4px;background:#333}.adbar i{display:block;height:100%;background:var(--accent2);width:0;transition:width linear}
  .premium-cta{margin-top:14px;font-size:13px;color:var(--gold);cursor:pointer;background:none;border:0}
  .feat{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px}
  .price{display:flex;justify-content:space-between;align-items:center}
  .attrib{font-size:12px;color:var(--muted);line-height:1.5;margin-top:16px}
  .profhead{display:flex;gap:14px;align-items:center}
  .srcrow{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
  .srcrow .muted{flex:none}
  .hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .hscroll::-webkit-scrollbar{display:none}
  .hscroll .chip{flex:none;padding:7px 11px;font-size:13px}
  .flabel{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.5px}
  #modeFilters .flabel:first-child{margin-top:0}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .grid3 select{width:100%;padding:9px 8px;font-size:14px}
  .link{color:#bcd0ff;font-size:13px;cursor:pointer}
  details.more{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
  details.more summary{cursor:pointer;color:var(--muted);font-size:14px}
  details.more .row:last-child{margin-bottom:0}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;position:sticky;bottom:76px;z-index:4;padding:8px 0;background:linear-gradient(transparent,var(--bg) 30%)}
  .actions .btn{padding:14px 8px}
  .reshead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px}
  .reshead b{font-size:16px}
  .ressub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 2px}
  .ritem{cursor:pointer}
  .ritem .origin-mini{font-size:12px;color:#bcd0ff}
  .avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .avopt{border:2px solid transparent;border-radius:14px;background:var(--card2);padding:10px 4px;text-align:center;cursor:pointer;font-size:11px;color:var(--muted)}
  .avopt span{display:flex;width:52px;height:52px;margin:0 auto 6px;border-radius:50%;align-items:center;justify-content:center;font-size:30px}
  .avopt.on{border-color:var(--accent);color:var(--text)}
  .av.emo{font-size:16px}
  .av.lg.emo{font-size:34px}
  .seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:9px;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--text);color:#111;font-weight:600}
  .ask{display:flex;gap:8px}
  .ask input{flex:1;min-width:0}
  .ask .btn{width:auto;padding:10px 16px;font-size:15px;flex:none}
  .understood{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px}
  .understood .tag{color:var(--text)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .hint i{cursor:pointer;color:#bcd0ff;font-style:normal}
  .fu{background:linear-gradient(135deg,#1d2a45,#2a1d3f);border:1px solid #3b4a7a;border-radius:var(--r);padding:14px;margin-bottom:6px;display:flex;gap:12px;align-items:center}
  .fu .info{flex:1;min-width:0}
  .fu .btns{grid-template-columns:1fr 1fr 1fr;margin-top:10px}
  .fu .btn.ghost{padding:9px 4px;font-size:13px}
  .watch{margin-top:12px}
  .chip .x{opacity:.7;margin-left:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cosa<span>Guardo</span></h1>
    <span class="pill" id="statusPill" data-a="goto" data-view="v-profile"></span>
  </header>

  <!-- ===================== SCEGLI ===================== -->
  <section id="v-pick" class="view on">
    <div id="setupBanner"></div>
    <div id="followUp"></div>
    <div class="srcrow"><span class="muted">Da dove:</span><div class="hscroll" id="srcChips"></div></div>

    <div class="seg" id="modeSeg">
      <button data-a="mode" data-id="desc">✨ Descrivi</button>
      <button data-a="mode" data-id="filters">⚙️ Filtri</button>
    </div>

    <div class="section" id="modeDesc">
      <div class="ask"><input type="text" id="descBox" placeholder="Es. un horror coi fantasmi sotto le 2 ore" autocomplete="off" enterkeyhint="search">
        <button class="btn" data-a="describe" id="descBtn">Cerca</button></div>
      <div id="descOut"></div>
    </div>

    <div class="section" id="modeFilters">
      <div class="flabel">Genere</div><div class="hscroll" id="genreChips"></div>
      <div class="flabel">Mood</div><div class="hscroll" id="moodChips"></div>
      <div class="grid3">
        <label><span class="flabel">Durata</span><select id="fDuration">
          <option value="0">Qualsiasi</option><option value="100">&lt; 1h40</option><option value="130">&lt; 2h10</option><option value="160">&lt; 2h40</option></select></label>
        <label><span class="flabel">Epoca</span><select id="fEra">
          <option value="all">Qualsiasi</option><option value="classic">Classici</option><option value="2000">2000–2014</option><option value="recent">Dal 2015</option><option value="new">Ultimi 2 anni</option></select></label>
        <label><span class="flabel">Voto</span><select id="fRating">
          <option value="0">Qualsiasi</option><option value="6">6+</option><option value="6.5">6.5+</option><option value="7">7+</option><option value="7.5">7.5+</option><option value="8">8+</option></select></label>
      </div>
      <div style="text-align:right;margin-top:8px"><span class="link" data-a="resetFilters">Azzera filtri</span></div>
    </div>

    <details class="more"><summary>Altre opzioni</summary>
      <div class="row"><label>Solo film che posso vedere<br><span class="muted">sulle mie piattaforme (anche per le liste)</span></label>
        <label class="switch"><input type="checkbox" id="fOnlyAvail"><span></span></label></div>
      <div class="row"><label>Solo film conosciuti<br><span class="muted">almeno 300 voti su TMDB</span></label>
        <label class="switch"><input type="checkbox" id="fPopular"><span></span></label></div>
      <div class="row"><label>Escludi film che ho già visto</label>
        <label class="switch"><input type="checkbox" id="fHideSeen"><span></span></label></div>
    </details>

    <div class="actions">
      <button class="btn ghost" data-a="showResults" id="showBtn">🔍 Mostra film</button>
      <button class="btn" data-a="pick">🎲 A caso</button>
    </div>
    <div id="results"></div>
  </section>

  <!-- ===================== LISTE ===================== -->
  <section id="v-lists" class="view"></section>

  <!-- ===================== PROFILO ===================== -->
  <section id="v-profile" class="view"></section>
</div>

<nav><div class="in">
  <button data-a="goto" data-view="v-pick" class="on"><b>🔍</b>Cerca</button>
  <button data-a="goto" data-view="v-lists"><b>📋<span class="badge" id="invBadge"></span></b>Liste</button>
  <button data-a="goto" data-view="v-profile"><b>👤</b>Profilo</button>
</div></nav>

<div class="onb" id="onb"></div>
<div class="loader" id="loader"></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   1. CONFIGURAZIONE
   ===================================================================== */
const API = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/";
const REGION = "IT", LANG = "it-IT";
const MIN_VOTES = 300;
const AD_EVERY = 3;          // pubblicità alla 1ª scelta e poi ogni 3 (solo utenti gratuiti)
const AD_SECONDS = 5;        // durata annuncio simulato
const FREE_MAX_LISTS = 3;    // liste massime per utenti gratuiti
const LIST_TYPES = {
  personal:{icon:"📋", label:"Personale", desc:"Solo per te"},
  couple:  {icon:"💑", label:"Coppia",    desc:"Tu e un'altra persona", max:2},
  friends: {icon:"👯", label:"Amici",     desc:"Fino a 10 persone",      max:10},
};
const MOODS = {
  leggero:   {label:"😌 Leggero",        g:[35,16,10751],   not:[27,53,10752]},
  adrenalina:{label:"⚡ Adrenalina",     g:[28,53,12]},
  emozione:  {label:"🥹 Emozionante",    g:[18,10749]},

const fold = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

function mockApi(path, q){
  const strip = m => { const {providers,runtime,...r}=m; return r; };
  const ids=s=>String(s).split(/[|,]/).map(Number);
  if(path==="/search/keyword") return {results:DEMO_KEYWORDS.filter(k=>k.name.includes(fold(q.query))).map(({films,...k})=>k)};
  if(path==="/search/person") return {results:DEMO_PEOPLE.filter(p=>fold(q.query).split(/\s+/).every(w=>fold(p.name).includes(w))).map(({films,...p})=>p)};
  if(path==="/genre/movie/list") return {genres:BASE_GENRES};
  if(path==="/watch/providers/movie") return {results:DEMO_PROVIDERS.map(([id,name],i)=>({provider_id:id,provider_name:name,logo_path:null,display_priorities:{IT:i}}))};
  if(path==="/discover/movie"||path==="/search/movie"){
    let r=DEMO;
    if(path==="/search/movie") r=r.filter(m=>fold(m.title).includes(fold(q.query)));
    else{
      const films=(list,s)=>ids(s).flatMap(id=>(list.find(x=>x.id===id)||{films:[]}).films);
      if(q.with_keywords){ const f=films(DEMO_KEYWORDS,q.with_keywords); r=r.filter(m=>f.includes(m.id)); }
      if(q.with_cast){ const f=films(DEMO_PEOPLE,q.with_cast); r=r.filter(m=>f.includes(m.id)); }
      if(q.with_crew){ const f=films(DEMO_PEOPLE,q.with_crew); r=r.filter(m=>f.includes(m.id)); }
      if(q.with_watch_providers) r=r.filter(m=>m.providers.some(p=>ids(q.with_watch_providers).includes(p)));
      if(q.with_genres) r=r.filter(m=>m.genre_ids.some(g=>ids(q.with_genres).includes(g)));
      if(q.without_genres) r=r.filter(m=>!m.genre_ids.some(g=>ids(q.without_genres).includes(g)));
      if(q["with_runtime.lte"]) r=r.filter(m=>m.runtime<=q["with_runtime.lte"]);
      if(q["vote_average.gte"]) r=r.filter(m=>m.vote_average>=q["vote_average.gte"]);
      if(q["primary_release_date.gte"]) r=r.filter(m=>m.release_date>=q["primary_release_date.gte"]);
      if(q["primary_release_date.lte"]) r=r.filter(m=>m.release_date<=q["primary_release_date.lte"]);
    }
    const page=+q.page||1, per=20;
    return {page,results:r.slice((page-1)*per,page*per).map(strip),total_results:r.length,total_pages:Math.max(1,Math.ceil(r.length/per))};
  }
  const mm=path.match(/^\/movie\/(\d+)$/);
  if(mm){
    const m=DEMO.find(x=>x.id===+mm[1]); if(!m) throw new Error("HTTP 404");
    const flat=m.providers.map(id=>{const p=DEMO_PROVIDERS.find(x=>x[0]===id); return {provider_id:id,provider_name:p[1],logo_path:null};});
    return {...strip(m),runtime:m.runtime,genres:m.genre_ids.map(id=>({id})),tagline:"",
      "watch/providers":{results:{IT:{link:null,flatrate:flat}}}};
  }
  throw new Error("HTTP 404");
}

const DB_KEY = "cosaguardo_db_v3", DEV_KEY = "cosaguardo_dev";
const DB = {
  data:null,
  empty(){ return {users:[],profiles:{},lists:[],list_members:[],list_items:[],list_invites:[],list_links:[],seen:[],ratings:[],session:null}; },
  load(){ try{ this.data=JSON.parse(localStorage.getItem(DB_KEY)); }catch(e){} if(!this.data) this.data=this.empty();
    for(const [k,v] of Object.entries(this.empty())) if(!(k in this.data)) this.data[k]=v;
    for(const u of this.data.users) if(!u.username && u.provider!=="guest") u.username=Usernames.suggest(u.name); },
  save(){ localStorage.setItem(DB_KEY, JSON.stringify(this.data)); },
};
const uid = p => p+"_"+Math.random().toString(36).slice(2,10);
// @nomeutente: unico, 3-20 caratteri, minuscole/numeri/punto/trattino basso. In produzione l'unicità la garantisce il DB
const Usernames = {
  norm: s => fold(s).replace(/^@/,"").replace(/[^a-z0-9._]/g,""),
  valid: u => /^[a-z0-9._]{3,20}$/.test(u) && !/^[._]|[._]$/.test(u),
  taken: (u,exceptId) => DB.data.users.some(x=>x.username===u && x.id!==exceptId),
  suggest(name){ let base=Usernames.norm(String(name).trim().replace(/\s+/g,".")).replace(/^[._]+|[._]+$/g,"").slice(0,16);
    if(base.length<3) base=(base+"film").slice(0,16); let u=base,i=1; while(Usernames.taken(u)) u=base+(++i); return u; },
  error(u,exceptId){ if(!Usernames.valid(u)) return "Da 3 a 20 caratteri: lettere minuscole, numeri, punto o trattino basso";
    if(Usernames.taken(u,exceptId)) return "Nome utente già in uso"; return null; },
};
const D = () => DB.data;

const Auth = {
  current(){ const s=D().session; return s ? D().users.find(u=>u.id===s.userId)||null : null; },
  signUp({name,email,provider,username}){
    const u={id:uid("u"),name,username:username||null,email:email||null,provider,created_at:Date.now()};
    D().users.push(u);
    D().profiles[u.id]={providerIds:[],favGenres:[],onboarded:false,premium:false,filters:structuredClone(DEFAULT_FILTERS)};
    D().session={userId:u.id};
    Lists.create("La mia lista","personal");
    DB.save(); return u;
  },
  login(userId){ D().session={userId}; DB.save(); },
  logout(){ D().session=null; DB.save(); },
  byEmail(email){ return D().users.find(u=>u.email && u.email.toLowerCase()===email.toLowerCase()); },
  upgradeGuest(name,email,username){ const u=Auth.current(); Object.assign(u,{name,email,username,provider:"email"}); DB.save(); },
  setUsername(username){ Auth.current().username=username; DB.save(); },
  deleteAccount(){
    const id=Auth.current().id, d=D();
    for(const l of Lists.mine()){
      const others=d.list_members.filter(m=>m.list_id===l.id && m.user_id!==id);
      if(!others.length) Lists.remove(l.id);
      else { if(l.owner_id===id){ l.owner_id=others[0].user_id; others[0].role="owner"; } }
    }
    d.list_members=d.list_members.filter(m=>m.user_id!==id);
    d.list_items=d.list_items.filter(i=>i.added_by!==id);
    d.list_links=d.list_links.filter(x=>x.linked_by!==id);
    d.list_invites=d.list_invites.filter(x=>x.from_user!==id && x.to_user!==id);
    d.seen=d.seen.filter(s=>s.user_id!==id);
    d.ratings=d.ratings.filter(r=>r.user_id!==id);
    delete d.profiles[id];
    d.users=d.users.filter(u=>u.id!==id);
    d.session=null; DB.save();
  },
};
const userById = id => D().users.find(u=>u.id===id);
const userName = id => userById(id)?.name || "Utente eliminato";

const Lists = {
  mine(){ const me=Auth.current(); if(!me) return [];
    const ids=D().list_members.filter(m=>m.user_id===me.id).map(m=>m.list_id);
    return D().lists.filter(l=>ids.includes(l.id)); },
  get(id){ return D().lists.find(l=>l.id===id); },
  isMember(id){ return Lists.mine().some(l=>l.id===id); },
  members(id){ return D().list_members.filter(m=>m.list_id===id).map(m=>({...m,user:userById(m.user_id)})); },
  newCode(){ const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s; do{ s=[...Array(6)].map(()=>c[Math.random()*c.length|0]).join(""); }while(D().lists.some(l=>l.invite_code===s)); return s; },
  create(name,type){
    const me=Auth.current();
    const l={id:uid("l"),name,type,owner_id:me.id,invite_code:type==="personal"?null:Lists.newCode(),created_at:Date.now()};
    D().lists.push(l); D().list_members.push({list_id:l.id,user_id:me.id,role:"owner",joined_at:Date.now()});
    DB.save(); return l;
  },
  byCode(code){ return D().lists.find(x=>x.invite_code===String(code||"").trim().toUpperCase()); },
  seatsLeft(id){ const max=LIST_TYPES[Lists.get(id).type].max||99; return max-Lists.members(id).length-Invites.forList(id).length; },
  addMember(id,userId){
    const l=Lists.get(id); if(!l) return {error:"La lista non esiste più"};
    if(D().list_members.some(m=>m.list_id===id&&m.user_id===userId)) return {error:"Fai già parte di questa lista",list:l};
    const max=LIST_TYPES[l.type].max; if(max && Lists.members(id).length>=max) return {error:`La lista è al completo (max ${max} persone)`};
    D().list_members.push({list_id:id,user_id:userId,role:"member",joined_at:Date.now()});
    D().list_invites.forEach(i=>{ if(i.list_id===id&&i.to_user===userId&&i.status==="pending") i.status="accepted"; });
    DB.save(); return {list:l};
  },
  joinByLink(code){ const l=Lists.byCode(code); return l ? Lists.addMember(l.id,Auth.current().id) : {error:"Invito non valido o scaduto"}; },
  leave(id){ const me=Auth.current().id, d=D();
    d.list_members=d.list_members.filter(m=>!(m.list_id===id&&m.user_id===me));
    d.list_links=d.list_links.filter(x=>!(x.list_id===id&&x.linked_by===me)); DB.save(); },
  remove(id){ const d=D(); d.lists=d.lists.filter(l=>l.id!==id); d.list_members=d.list_members.filter(m=>m.list_id!==id); d.list_items=d.list_items.filter(i=>i.list_id!==id);
    d.list_links=d.list_links.filter(x=>x.list_id!==id&&x.linked_list_id!==id); d.list_invites=d.list_invites.filter(x=>x.list_id!==id); DB.save(); },
  // --- liste collegate (Premium): una lista condivisa "include" le liste personali dei membri, senza duplicare i film
  links(id){ return D().list_links.filter(x=>x.list_id===id && Lists.get(x.linked_list_id)); },
  link(id,linkedId){ if(Lists.links(id).some(x=>x.linked_list_id===linkedId)) return;
    D().list_links.push({list_id:id,linked_list_id:linkedId,linked_by:Auth.current().id,at:Date.now()}); DB.save(); },
  unlink(id,linkedId){ D().list_links=D().list_links.filter(x=>!(x.list_id===id&&x.linked_list_id===linkedId)); DB.save(); },
  linkedItems(id){ const own=new Set(Lists.items(id).map(i=>i.movie.id)), out=[];
    for(const ln of Lists.links(id)) for(const it of Lists.items(ln.linked_list_id)){
      if(own.has(it.movie.id)||out.some(o=>o.movie.id===it.movie.id)) continue; out.push({...it,via:ln.linked_list_id}); }
    return out; },
  allItems(id){ return [...Lists.items(id),...Lists.linkedItems(id)]; },
  copy(fromId,toId){ let n=0; for(const it of Lists.allItems(fromId)) if(!Lists.has(toId,it.movie.id)){ Lists.add(toId,it.movie); n++; } return n; },
  items(id){ return D().list_items.filter(i=>i.list_id===id); },
  has(id,movieId){ return D().list_items.some(i=>i.list_id===id && i.movie.id===movieId); },
  add(id,movie){ if(Lists.has(id,movie.id)) return; const {overview,providers,tagline,origin,...lite}=movie;
    D().list_items.unshift({id:uid("i"),list_id:id,movie:lite,added_by:Auth.current().id,added_at:Date.now()}); DB.save(); },
  removeItem(id,movieId){ D().list_items=D().list_items.filter(i=>!(i.list_id===id&&i.movie.id===movieId)); DB.save(); },

const memo = new Map();
async function api(path, params={}, forceMock=false){
  const q={}; for(const [k,v] of Object.entries(params)) if(v!==undefined&&v!==null&&v!=="") q[k]=v;
  if(isDemo()||forceMock){ await sleep(120); return mockApi(path,q); }
  const key=devKey(), isToken=key.startsWith("eyJ");
  const u=new URL(API+path);
  for(const [k,v] of Object.entries(q)) u.searchParams.set(k,v);
  if(!isToken) u.searchParams.set("api_key",key);
  const url=u.toString();
  if(memo.has(url)) return memo.get(url);
  const p=fetch(url,{headers:{accept:"application/json",...(isToken?{Authorization:"Bearer "+key}:{})}})
    .then(async r=>{ if(r.status===401) throw new Error("KEY"); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
  memo.set(url,p); p.catch(()=>memo.delete(url));
  return p;
}

];
const NL_NUM = {un:1,uno:1,una:1,due:2,tre:3,quattro:4};
const NL_DECADES = {sessanta:60,settanta:70,ottanta:80,novanta:90,duemila:0};
const NL_STOP = new Set("un una uno il lo la i gli le che e ed non ma per in a al da di del della con dove film ore ora minuti anni piu più meno qualcosa tipo come sotto sopra stasera nello nella nei negli nel sul sulla col coi tra fra senza molto bello bella brutto paura".split(" "));
const rx = p => new RegExp(`(^|[^a-zà-ù])(${p})(?![a-zà-ù])`,"i");

async function parseQuery(text){
  const out={genres:[],moods:[],maxDur:0,era:null,years:null,yearsLabel:null,minRating:null,keywords:[],people:[],labels:[]};
  let t=" "+text.trim()+" ";
  // 1) persone: "con Tom Hanks", "di Nolan Christopher", "diretto da ...", "regia di ..."
  const pr=/(?:\bcon|\bcoi|\bdi|\bda|diretto da|regia di|interpretato da|protagonista)\s+(?=([A-Za-zÀ-ÿ'.-]+(?:\s+[A-Za-zÀ-ÿ'.-]+){0,2}))/gi;
  for(const m of [...t.matchAll(pr)]){
    let toks=m[1].split(/\s+/); const cut=toks.findIndex(w=>NL_STOP.has(w.toLowerCase())); if(cut>=0) toks=toks.slice(0,cut);
    if(toks.length<2 || toks.some(w=>w.length<2)) continue;
    for(const n of [toks.length, 2]){
      const q=toks.slice(0,n).join(" ");
      try{ const r=(await api("/search/person",{query:q,language:LANG})).results||[];
        const hit=r.find(p=>q.split(" ").every(w=>fold(p.name).includes(fold(w))));
        if(hit && !out.people.some(p=>p.id===hit.id)){ out.people.push({id:hit.id,name:hit.name,role:hit.known_for_department==="Directing"?"crew":"cast"}); t=t.replace(q," "); break; }
      }catch(e){}
    }
  }
  const low=t.toLowerCase().replace(/’/g,"'");
  // 2) generi e mood
  for(const [p,id] of NL_GENRES) if(rx(p).test(low) && !out.genres.includes(id)) out.genres.push(id);
  for(const [p,m] of NL_MOODS) if(rx(p).test(low) && !out.moods.includes(m)) out.moods.push(m);
  // 3) durata: "2h", "2 ore", "1h30", "90 minuti", "un'ora e mezza", "corto"
  let dur=0, m;
  if((m=low.match(/(\d+)\s*h\s*(\d{1,2})?/))) dur=+m[1]*60+(+m[2]||0);
  else if((m=low.match(/(\d+(?:[.,]5)?|un|una|due|tre|quattro)\s*'?\s*or[ae](\s*e\s*mezz[ao])?/))) dur=(NL_NUM[m[1]]||parseFloat(m[1].replace(",",".")))*60+(m[2]?30:0);
  else if((m=low.match(/(\d{2,3})\s*(?:minuti|min)\b/))) dur=+m[1];
  else if(rx("cort\\w*|breve|veloce").test(low)) dur=100;
  if(dur>=30 && dur<=300) out.maxDur=dur;
  // 4) epoca: "anni 80", "anni '90", "anni ottanta", "del 1994", "recente", "classico"
  if((m=low.match(/anni\s*'?\s*(\d0)\b/)) || (m=low.match(/anni\s+(sessanta|settanta|ottanta|novanta|duemila)/))){
    const d=NL_DECADES[m[1]]??+m[1], from=d>=50?1900+d:2000+d; out.years=[from,from+9]; out.yearsLabel=`Anni ${String(d).padStart(2,"0")}`;
  } else if((m=low.match(/\b(19[2-9]\d|20[0-3]\d)\b/))) { out.years=[+m[1],+m[1]]; out.yearsLabel=m[1]; }
  else if(rx("recent\\w*|nuov\\w*|uscit\\w* da poco|ultim\\w* anni").test(low)) out.era="recent";
  else if(rx("classic\\w*|vecchi\\w*|d'epoca|intramontabil\\w*").test(low)) out.era="classic";
  // 5) qualità
  if(rx("bell[oaie]|capolavor\\w*|premiat\\w*|oscar|acclamat\\w*|di qualit\\w*|imperdibil\\w*").test(low)) out.minRating=7.5;
  // 6) temi → parole chiave TMDB
  for(const [p,en] of NL_KEYWORDS){
    const hit=low.match(rx(p)); if(!hit) continue;
    try{ const r=(await api("/search/keyword",{query:en})).results||[];
      const k=r.find(x=>x.name.toLowerCase()===en)||r[0];
      if(k && !out.keywords.some(x=>x.id===k.id)) out.keywords.push({id:k.id,name:hit[2],en});
    }catch(e){}
  }
  // etichette "Ho capito"
  out.genres.forEach(g=>out.labels.push(`${GENRE_EMOJI[g]||"🎬"} ${genreName(g)}`));
  out.moods.forEach(x=>out.labels.push(MOODS[x].label));
  out.keywords.forEach(k=>out.labels.push(`🏷 ${k.name}`));
  out.people.forEach(p=>out.labels.push(`${p.role==="crew"?"🎬 regia":"🎭"} ${p.name}`));
  if(out.maxDur) out.labels.push(`⏱ max ${fmtDur(out.maxDur)}`);
  if(out.yearsLabel) out.labels.push(`📅 ${out.yearsLabel}`);
  if(out.era) out.labels.push(out.era==="recent"?"📅 Recenti":"📅 Classici");
  if(out.minRating) out.labels.push(`⭐ ${out.minRating}+`);
  return out;
}

function parsedToParams(r){
  const p={language:LANG,sort_by:"popularity.desc",include_adult:false,"vote_count.gte":50};
  if(r.genres.length) p.with_genres=r.genres.join(",");
  else if(r.moods.length) p.with_genres=[...new Set(r.moods.flatMap(m=>MOODS[m].g))].join("|");
  if(r.keywords.length) p.with_keywords=r.keywords.map(k=>k.id).join("|");
  const cast=r.people.filter(x=>x.role==="cast"), crew=r.people.filter(x=>x.role==="crew");
  if(cast.length) p.with_cast=cast.map(x=>x.id).join("|");
  if(crew.length) p.with_crew=crew.map(x=>x.id).join("|");
  if(r.maxDur) p["with_runtime.lte"]=r.maxDur;
  if(r.minRating) p["vote_average.gte"]=r.minRating;
  if(r.years){ p["primary_release_date.gte"]=`${r.years[0]}-01-01`; p["primary_release_date.lte"]=`${r.years[1]}-12-31`; }
  else if(r.era==="recent") p["primary_release_date.gte"]="2015-01-01";
  else if(r.era==="classic") p["primary_release_date.lte"]="1999-12-31";
  return p;
}

  if(p.searchMode!=="desc") return {...f,keywords:[],people:[]};
  const d=p.descCrit||{};
  return {...structuredClone(DEFAULT_FILTERS),sources:f.sources,hideSeen:f.hideSeen,popular:f.popular,onlyAvail:f.onlyAvail,
    genres:d.genres||[],moods:d.moods||[],maxDur:d.maxDur||0,era:d.years?"custom":(d.era||"all"),years:d.years||null,
    minRating:d.minRating??0,keywords:d.keywords||[],people:d.people||[]}; };
const moodGenres = () => [...new Set(C().moods.flatMap(m=>MOODS[m].g))];
const moodExcluded = () => { const inc=new Set([...moodGenres(),...C().genres]);
  return [...new Set(C().moods.flatMap(m=>MOODS[m].not||[]))].filter(g=>!inc.has(g)); };
function eraRange(){ const y=new Date().getFullYear();
  if(C().era==="custom" && C().years) return [`${C().years[0]}-01-01`,`${C().years[1]}-12-31`];
  return {classic:[null,"1999-12-31"],"2000":["2000-01-01","2014-12-31"],recent:["2015-01-01",null],new:[`${y-2}-01-01`,null]}[C().era]||[null,null]; }
function discoverParams(){
  const f=C(), [from,to]=eraRange();
  const p={language:LANG,watch_region:REGION,include_adult:false,sort_by:"popularity.desc",
    with_watch_providers:prof().providerIds.join("|"),with_watch_monetization_types:"flatrate",
    "primary_release_date.gte":from,"primary_release_date.lte":to,"with_runtime.lte":f.maxDur||null,
    "vote_average.gte":f.minRating||null,"vote_count.gte":f.popular?MIN_VOTES:20};
  if(f.genres.length) p.with_genres=f.genres.join("|"); else if(f.moods.length) p.with_genres=moodGenres().join("|");
  const not=moodExcluded(); if(not.length) p.without_genres=not.join(",");
  if(f.keywords.length) p.with_keywords=f.keywords.map(k=>k.id).join("|");
  const cast=f.people.filter(x=>x.role==="cast"), crew=f.people.filter(x=>x.role==="crew");
  if(cast.length) p.with_cast=cast.map(x=>x.id).join("|");
  if(crew.length) p.with_crew=crew.map(x=>x.id).join("|");
  return p;
}
const moodOk = ids => !C().moods.length || !C().genres.length || ids.some(g=>moodGenres().includes(g));
function movieMatches(m){
  const f=C(), ids=m.genre_ids||[];
  if(f.genres.length && !ids.some(g=>f.genres.includes(g))) return false;
  if(f.moods.length && !ids.some(g=>moodGenres().includes(g))) return false;
  if(moodExcluded().some(g=>ids.includes(g))) return false;
  if(f.maxDur && m.runtime && m.runtime>f.maxDur) return false;
  const [from,to]=eraRange();
  if(m.year && from && m.year<from.slice(0,4)) return false;
  if(m.year && to && m.year>to.slice(0,4)) return false;
  if(m.vote!=null && !m.custom && m.vote<f.minRating) return false;
  if(f.hideSeen && Seen.has(m.id)) return false;
  return true;
}
const activeListIds = () => C().sources.filter(s=>s!=="platforms" && Lists.isMember(s));
function listPool(){ // elementi delle liste selezionate, senza doppioni
  const map=new Map();
  for(const lid of activeListIds()) for(const it of Lists.allItems(lid)){
    if(!movieMatches(it.movie)) continue;
    const e=map.get(it.movie.id)||{movie:it.movie,lists:[],addedBy:[]};
    const name=it.via?`${Lists.get(lid).name} → ${listLabel(Lists.get(it.via))}`:Lists.get(lid).name;
    if(!e.lists.includes(name)) e.lists.push(name); if(!e.addedBy.includes(it.added_by)) e.addedBy.push(it.added_by);
    map.set(it.movie.id,e);
  }
  return [...map.values()];
}
// gusti: generi preferiti + voti 👍/👎 dati in passato
function affinity(genreIds){
  let s=0; const fav=prof().favGenres;
  for(const g of genreIds||[]){ if(fav.includes(g)) s+=1; for(const r of Ratings.mine()) if(r.genre_ids.includes(g)) s+=0.5*r.value; }
  return Math.min(3,Math.max(0.3,1+0.25*s));
}
function weighted(arr,getMovie=x=>x){
  const w=arr.map(x=>{const m=getMovie(x); return Math.pow(Math.max((m.vote||6.5)-3,1),2)*affinity(m.genre_ids);});
  let r=Math.random()*w.reduce((a,b)=>a+b,0), i=0; while(i<arr.length-1 && (r-=w[i])>0) i++; return arr[i];
}
let recent=[];
function remember(id,n){ recent.push(id); if(recent.length>Math.max(1,Math.min(50,Math.floor(n/2)))) recent.shift(); }

async function pickFromPlatforms(){
  if(!prof().providerIds.length) return null;
  const p=discoverParams(), first=await api("/discover/movie",{...p,page:1});
  if(!first.total_results) return null;
  const maxPage=Math.min(first.total_pages,500);
  for(let a=0;a<6;a++){
    const page=a===0?1+Math.floor(Math.random()*maxPage):1+Math.floor(Math.random()*Math.min(maxPage,a*3));
    const data=page===1?first:await api("/discover/movie",{...p,page});
    const cand=data.results.filter(m=>!recent.includes(m.id)&&!(C().hideSeen&&Seen.has(m.id))&&moodOk(m.genre_ids||[])).map(normalize);
    if(cand.length){ const f=weighted(cand); remember(f.id,first.total_results); return await details(f); }
  }
  recent=[]; return null;
}
async function pickFromLists(pool){
  let cand=pool.filter(e=>!recent.includes(e.movie.id)); if(!cand.length) cand=pool;
  for(let i=0;i<10 && cand.length;i++){
    const e=weighted(cand,x=>x.movie), d=await details(e.movie);
    if(!C().onlyAvail || availableToMe(d)){ remember(e.movie.id,pool.length);
      return {...d,origin:{lists:e.lists,addedBy:e.addedBy}}; }
    cand=cand.filter(x=>x!==e);
  }
  return null;
}
async function pick(){
  const usePlat=C().sources.includes("platforms"), pool=listPool();
  const listFirst=pool.length && (!usePlat || Math.random()<0.5);
  if(listFirst){ const r=await pickFromLists(pool); if(r) return r; }
  if(usePlat){ const r=await pickFromPlatforms(); if(r) return r; }
  if(!listFirst && pool.length) return await pickFromLists(pool);
  return null;
}

const resultsKey = () => JSON.stringify([prof().searchMode,C(),discoverParams(),Seen.ids().length,activeListIds().map(id=>Lists.allItems(id).length),prof().providerIds]);
function clearResults(){ R={key:null,items:[],listCount:0,page:0,totalPages:0,platTotal:0,loading:false,error:null}; $("#results").innerHTML=""; }
const refreshResults=debounce(async()=>{ if(!me()) return; const k=resultsKey(); if(k===R.key){ renderResults(); return; } await loadResults(true); },300);
async function loadResults(reset){
  const c=C();
  if(reset){
    R={key:resultsKey(),items:[],listCount:0,page:0,totalPages:1,platTotal:0,loading:true,error:null}; renderResults();
    let li=listPool().map(e=>({...e.movie,origin:{lists:e.lists,addedBy:e.addedBy}}));
    if(c.onlyAvail){ const det=await Promise.all(li.slice(0,40).map(m=>details(m).catch(()=>null))); li=li.filter((m,i)=>det[i]&&availableToMe(det[i])); }

  }
  const k=R.key;
  if(c.sources.includes("platforms") && prof().providerIds.length && R.page<R.totalPages){
    R.loading=true; renderResults();
    try{
      const d=await api("/discover/movie",{...discoverParams(),page:R.page+1});

      R.page=d.page; R.totalPages=Math.min(d.total_pages,500); R.platTotal=d.total_results;

// ricerca unica: titolo + persona + descrizione in parallelo, risultati raggruppati
const doSearch=debounce(async()=>{
  const q=$("#listSearch")?.value.trim(); if(q===undefined) return;
  if(q.length<2){ $("#sugg").innerHTML=""; return; }
  $("#sugg").innerHTML=`<p class="muted">Cerco…</p>`;
  try{
    const words=q.split(/\s+/);
    const [byTitle,ppl,parsed]=await Promise.all([
      api("/search/movie",{query:q,language:LANG,include_adult:false}).then(r=>r.results).catch(()=>[]),
      words.length<=3 ? api("/search/person",{query:q,language:LANG}).then(r=>r.results||[]).catch(()=>[]) : [],
      parseQuery(q).catch(()=>null),
    ]);
    const sections=[], seen=new Set();
    const add=(head,list,max)=>{ const items=list.map(normalize).filter(f=>!seen.has(f.id)).slice(0,max); items.forEach(f=>seen.add(f.id)); if(items.length) sections.push({head,items}); };
    const person=ppl.find(x=>words.every(w=>fold(x.name).includes(fold(w))));
    const tasks=[];
    if(person){ const dir=person.known_for_department==="Directing";
      tasks.push(api("/discover/movie",{language:LANG,sort_by:"popularity.desc",include_adult:false,[dir?"with_crew":"with_cast"]:person.id})
        .then(r=>({head:`${dir?"🎬 Film diretti da":"🎭 Film con"} ${esc(person.name)}`,list:r.results})).catch(()=>null)); }
    const useDesc=parsed && parsed.labels.length && !(person && parsed.people.length===parsed.labels.length);
    if(useDesc) tasks.push(api("/discover/movie",parsedToParams(parsed))
      .then(r=>({head:`✨ Ho capito: ${parsed.labels.map(esc).join(" · ")}`,list:r.results})).catch(()=>null));
    const extra=(await Promise.all(tasks)).filter(Boolean);
    if(q!==$("#listSearch")?.value.trim()) return;
    add("🔤 Titoli",byTitle,6);
    extra.forEach(x=>add(x.head,x.list,8));
    searchSections=sections; searchResults=sections.flatMap(x=>x.items); renderSugg();
  }catch(e){ $("#sugg").innerHTML=`<p class="muted">${esc(apiErrorMsg(e))}</p>`; }
},450);
function renderSugg(){
  $("#sugg").innerHTML=searchSections.length?searchSections.map(sec=>`<div class="muted" style="margin:12px 0 2px;font-weight:600">${sec.head}</div>`+
    sec.items.map(f=>`<div class="item">${thumbHtml(f)}
      <div class="info"><div class="t">${esc(f.title)}</div><div class="muted">${f.year||"—"}${f.vote?` · ⭐ ${f.vote.toFixed(1)}`:""}</div></div>
      ${Lists.has(openListId,f.id)?`<span class="muted">in lista</span>`:`<button class="icon" data-a="addSearch" data-id="${f.id}">➕</button>`}</div>`).join("")).join("")
    :`<p class="muted">Nessun film trovato. Prova con un'altra parola o aggiungilo a mano qui sotto.</p>`;
}

  }

      <div style="text-align:center;margin:14px 0 4px">${avatar(me(),"lg")}<div style="margin-top:6px;font-weight:600">${esc(avatarOf(me())?.name||me().name)}</div></div>
      ${avatarGrid(me().avatar)}`;
    foot=`<button class="btn" data-a="onbGo" data-step="platforms">${me().avatar?"Continua":"Salta per ora"}</button>`;
  }
  if(s==="platforms"){
    const p=prof();
    body=`${dots}<h2 class="big">A cosa sei abbonato?</h2><p class="muted">Ti proporremo solo film inclusi nei tuoi abbonamenti. Puoi cambiarli quando vuoi.</p>
      <div class="chips" style="margin-top:16px">${metaOk?PROVIDERS.slice(0,16).map(g=>chip(`${logoHtml(g)}${esc(g.name)}`,g.ids.some(id=>p.providerIds.includes(id)),`data-a="prov" data-name="${esc(g.name)}"`,"plat")).join(""):`<span class="muted">Caricamento piattaforme…</span>`}</div>`;
    foot=`<button class="btn" data-a="onbGo" data-step="genres" ${p.providerIds.length?"":"disabled"}>Continua</button>`;
  }
  if(s==="genres"){
    body=`${dots}<h2 class="big">Cosa ti piace guardare?</h2><p class="muted">Facoltativo. Ci aiuta a centrare i tuoi gusti.</p>
      <div class="chips" style="margin-top:16px">${GENRES.map(g=>chip(`${GENRE_EMOJI[g.id]||"🎬"} ${esc(g.name)}`,prof().favGenres.includes(g.id),`data-a="favGenre" data-id="${g.id}"`)).join("")}</div>`;
    foot=`<button class="btn" data-a="onbGo" data-step="seen">Continua</button>`;
  }
  if(s==="seen"){
    if(!onb.seenTiles){
      body=`${dots}<h2 class="big">Hai già visto qualcuno di questi?</h2><p class="muted">Caricamento…</p>`;
      el.innerHTML=`<div class="wrap"><div class="body">${body}</div></div>`;
      try{ const d=await api("/discover/movie",{language:LANG,watch_region:REGION,with_watch_providers:prof().providerIds.join("|"),with_watch_monetization_types:"flatrate",sort_by:"popularity.desc","vote_count.gte":MIN_VOTES,page:1});
        onb.seenTiles=d.results.slice(0,12).map(normalize); }catch(e){ onb.seenTiles=[]; }
      return renderOnb();
    }
    body=`${dots}<h2 class="big">Hai già visto qualcuno di questi?</h2><p class="muted">Tocca quelli che hai visto: non te li proporremo.</p>
      <div class="tiles" style="margin-top:14px">${onb.seenTiles.map(f=>`<div class="tile ${Seen.has(f.id)?"on":""}" data-a="onbSeen" data-id="${f.id}" style="background:${gradient(f.title)}">
        ${f.poster?`<img src="${img(f.poster,"w185")}" alt="" onerror="this.remove()">`:""}<span>${f.poster?"":esc(f.title)}</span></div>`).join("")||`<p class="muted">Nessun film da mostrare.</p>`}</div>`;
    foot=`<button class="btn" data-a="onbGo" data-step="done">Continua</button>`;
  }
  if(s==="done"){
    body=`<div class="hero-emoji">🎉</div><h2 class="big" style="text-align:center">Tutto pronto, ${esc(me().name)}!</h2>
      <p style="text-align:center;color:var(--muted);line-height:1.5">Scegli genere e mood, poi tocca <b>“Scegli un film per me”</b>.<br><br>Vuoi decidere in due? Vai su <b>Liste</b> e crea una lista <b>Coppia</b>.</p>`;
    foot=`<button class="btn" data-a="onbFinish">Andiamo</button>`;
  }
  el.innerHTML=`<div class="wrap"><div class="body">${body}</div><div style="margin-top:24px">${foot}</div></div>`;
  el.scrollTop=0;
}

function checkUser(input){
  const msg=$("#"+input.id+"Msg"); if(!msg) return;
  const un=Usernames.norm(input.value); if(!un){ msg.textContent=""; return; }
  const err=Usernames.error(un,input.id==="eUser"?me()?.id:undefined);
  msg.innerHTML = err ? `<span style="color:#ff8a8d">✕ ${esc(err)}</span>` : `<span style="color:var(--ok)">✓ @${esc(un)} è disponibile</span>`;
}

async function reconnect(verbose){
  memo.clear(); metaOk=false;
  connInfo=null;
  try{ await loadMeta(); if(verbose) toast(isDemo()?"Uso il catalogo demo":"✅ Connesso a TMDB"); }
  catch(e){ GENRES=BASE_GENRES; connInfo=diagnose(e); if(verbose) toast("❌ "+connInfo.title); }
  if(onb){ if(["platforms","genres","seen"].includes(onb.step)) renderOnb(); } else renderAll();
}

/* =====================================================================
   14. AVVIO
   ===================================================================== */
DB.load();
if(!me()) startOnboarding("welcome");
else if(!prof().onboarded) startOnboarding("platforms");
else { renderAll(); consumeInvite(); }
reconnect(false);
</script>
